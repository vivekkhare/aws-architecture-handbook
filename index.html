Q('sap-005', '1.1', 'hard', 'A SaaS company serves 400 business customers from one shared Amazon ECS service and one Amazon Aurora cluster. Two large tenants periodically consume most of the capacity and degrade service for the rest. The company wants to keep the pooled model for cost reasons. Which combination BEST limits noisy-neighbour impact? (Choose TWO.)', [
  ['Apply per-tenant throttling at Amazon API Gateway with usage plans keyed to each tenant.', 1, 'Caps each tenant\'s request rate before it reaches shared compute.'],
  ['Move asynchronous work onto Amazon SQS with tenant-aware fairness so one tenant\'s backlog cannot starve the others.', 1, 'Isolates background load per tenant in a pooled system.'],
  ['Give every tenant its own AWS account and full stack.', 0, 'That abandons the pooled model the company wants to keep.'],
  ['Double the Aurora instance size.', 0, 'A large tenant simply consumes the extra capacity.'],
  ['Enable Aurora Backtrack.', 0, 'A recovery feature, unrelated to isolation.']
], 'service/api-gateway');
Q('sap-006', '1.1', 'medium', 'A logistics company processes shipment updates with a Lambda function invoked synchronously by another Lambda function, which is invoked by a third. Failures midway leave shipments in inconsistent states, and nobody can see where an update stopped. Which redesign addresses both problems with the LEAST custom code?', [
  ['Add try/catch blocks and custom retry loops to each function.', 0, 'More hand-written error handling, still no visibility.'],
  ['Orchestrate the steps with AWS Step Functions, using Retry and Catch with compensating steps.', 1, 'Explicit state, built-in retries, compensation paths and a visual history of each execution.'],
  ['Replace Lambda with larger EC2 instances.', 0, 'Changes compute, not coordination.'],
  ['Increase each function\'s timeout to 15 minutes.', 0, 'Pays for waiting and fixes neither issue.']
], 'service/step-functions');
Q('sap-007', '1.2', 'medium', 'A bank wants a customer-service assistant that answers questions using its 30,000 internal policy documents, which change weekly. Answers must reflect the latest documents and cite sources. The team wants the LEAST model-management effort. Which approach should the solutions architect choose?', [
  ['Fine-tune a foundation model on the documents every week.', 0, 'Costly, slow to refresh, and fine-tuned models do not cite sources.'],
  ['Use Amazon Bedrock Knowledge Bases to index the documents from Amazon S3 and retrieve relevant passages at query time.', 1, 'Retrieval-augmented generation keeps answers current through re-syncing and returns source references.'],
  ['Train a custom model from scratch on Amazon SageMaker AI.', 0, 'The highest effort and unnecessary for document question answering.'],
  ['Paste all documents into every prompt.', 0, 'Exceeds context limits and cost grows with every request.']
], 'service/bedrock');
Q('sap-008', '1.2', 'hard', 'A company calls a large foundation model on Amazon Bedrock for every support ticket: classification, sentiment and a draft reply. Costs are rising and classification latency is too high. Quality of draft replies must not drop. Which changes are MOST appropriate? (Choose TWO.)', [
  ['Route classification and sentiment to a smaller, cheaper model and keep the large model for drafting.', 1, 'Simple tasks rarely need the largest model; this cuts cost and latency where it matters.'],
  ['Enable prompt caching for the long, repeated system instructions.', 1, 'Repeated prompt prefixes are billed at a reduced rate and processed faster.'],
  ['Move all inference to provisioned throughput sized for peak.', 0, 'Guarantees capacity but usually raises cost for variable load.'],
  ['Disable guardrails to save tokens.', 0, 'Removes a safety control for a marginal saving.'],
  ['Increase the maximum output tokens.', 0, 'Raises cost.']
], 'service/bedrock');
Q('sap-009', '1.2', 'medium', 'An insurer is building an AI agent that reads a claim, looks up the policy through an internal API, and files a recommendation. The agent framework is open source. The company needs session isolation between users, managed scaling, and controlled access to internal APIs as tools. Which AWS capability fits BEST?', [
  ['Run the agent on a single EC2 instance with API keys in environment variables.', 0, 'No isolation, no scaling, and static credentials.'],
  ['Deploy the agent on Amazon Bedrock AgentCore Runtime and expose the internal APIs as tools through AgentCore Gateway with AgentCore Identity.', 1, 'Purpose-built runtime with per-session isolation, plus governed tool access and credentials.'],
  ['Use Amazon Lex intents.', 0, 'Lex builds scripted conversational bots, not tool-using agents.'],
  ['Use AWS Glue workflows.', 0, 'ETL orchestration.']
], 'service/bedrock');
Q('sap-010', '1.3', 'medium', 'A hospital group must keep patient imaging systems within its own data centre because of equipment latency, but wants to use the same AWS APIs, automation and managed databases as its cloud workloads. Which solution should be recommended?', [
  ['AWS Outposts in the data centre.', 1, 'AWS infrastructure and services on premises, operated through the parent Region.'],
  ['AWS Storage Gateway.', 0, 'Hybrid storage only.'],
  ['AWS Site-to-Site VPN.', 0, 'Connectivity, not local compute.'],
  ['AWS Wavelength.', 0, 'For 5G mobile edge applications in carrier networks.']
], 'service/outposts');
Q('sap-011', '1.3', 'hard', 'A company has a 1 Gbps AWS Direct Connect connection as its only link to AWS. An outage at the Direct Connect location took production offline for six hours. The business now requires connectivity to survive the loss of a device or an entire location, at consistent performance. Which design meets this?', [
  ['Add a second connection at the same Direct Connect location.', 0, 'Survives a device failure but not the loss of the location.'],
  ['Add a Site-to-Site VPN as backup.', 0, 'Cost-effective, but performance over the internet is not consistent.'],
  ['Provision connections at two different Direct Connect locations, each terminating on separate customer devices, with BGP failover.', 1, 'Location and device redundancy with dedicated-link performance.'],
  ['Upgrade the existing connection to 10 Gbps.', 0, 'More bandwidth, same single point of failure.']
], 'service/direct-connect');
Q('sap-012', '1.3', 'medium', 'Applications in 30 VPCs must resolve hostnames in the on-premises domain corp.example, and on-premises servers must resolve names in AWS private hosted zones. The network team wants one central configuration. What should be built?', [
  ['Run BIND servers on EC2 in every VPC.', 0, 'Thirty sets of servers to operate.'],
  ['Route 53 Resolver inbound and outbound endpoints in a shared networking VPC, with forwarding rules shared to the other accounts through AWS RAM.', 1, 'Central hybrid DNS, with rules distributed by sharing.'],
  ['A public hosted zone for corp.example.', 0, 'Exposes internal names and does not reach on-premises DNS.'],
  ['Edit the hosts file on each instance.', 0, 'Unmanageable.']
], 'service/route53');
Q('sap-013', '1.4', 'hard', 'A company must inspect all traffic between its 40 VPCs and all outbound internet traffic with a stateful firewall. VPCs attach to one transit gateway. Which architecture meets the requirement with centralised management?', [
  ['Security groups in every VPC with identical rules.', 0, 'No stateful inspection of content, and no central point.'],
  ['An inspection VPC with AWS Network Firewall, transit gateway route tables that send inter-VPC and internet-bound traffic through it, and appliance mode on the inspection attachment.', 1, 'All flows traverse one firewall layer; appliance mode keeps both directions on the same zone.'],
  ['A NAT gateway in every VPC.', 0, 'NAT does not inspect traffic.'],
  ['VPC peering between all VPCs with network ACLs.', 0, 'Hundreds of peerings and stateless filtering only.']
], 'service/transit-gateway');
Q('sap-014', '1.4', 'medium', 'A software vendor wants to offer its API to customers privately from their own VPCs. Many customers use the 10.0.0.0/16 range, the same as the vendor. Customers must not gain network access to anything else in the vendor\'s VPC. Which solution should be used?', [
  ['VPC peering with each customer.', 0, 'Fails with overlapping ranges and exposes the network.'],
  ['An AWS PrivateLink endpoint service in front of a Network Load Balancer.', 1, 'One-way, service-level access that works with overlapping CIDRs.'],
  ['A transit gateway shared with every customer.', 0, 'Overlapping routes and far too much connectivity.'],
  ['A public API with IP allow lists.', 0, 'Not private.']
], 'service/privatelink');
Q('sap-015', '1.4', 'hard', 'Sixty microservices owned by twelve teams run on a mix of ECS, EKS and Lambda in separate accounts and VPCs, several with overlapping CIDR ranges. Teams need service-to-service calls with IAM-based authorisation and no VPC peering or transit gateway routing to manage. Which service addresses this?', [
  ['AWS Cloud WAN.', 0, 'A global network backbone; it still routes IP networks and does not authorise service calls.'],
  ['Amazon VPC Lattice with a service network shared through AWS RAM and auth policies on services.', 1, 'Application-layer connectivity across accounts and compute types, independent of IP overlap, with IAM auth.'],
  ['One large shared VPC for all teams.', 0, 'A migration project that removes account isolation.'],
  ['Internet-facing load balancers for every service.', 0, 'Exposes internal services publicly.']
], 'service/vpc-lattice');
Q('sap-016', '1.4', 'medium', 'A company operates in nine AWS Regions with transit gateways peered by hand. Route tables are inconsistent and segmentation between production and development differs by Region. Management wants one policy that defines segments globally. Which service should replace the current design?', [
  ['AWS Cloud WAN with a core network policy defining production and development segments.', 1, 'A central policy document creates consistent segments across Regions.'],
  ['More transit gateway peering connections.', 0, 'More of the manual work that caused the problem.'],
  ['AWS Global Accelerator.', 0, 'Accelerates user traffic to endpoints; not a private network backbone.'],
  ['Amazon Route 53 private hosted zones.', 0, 'DNS, not routing.']
], 'service/cloud-wan');
Q('sap-017', '1.5', 'hard', 'A trading platform needs a relational database that accepts writes in both Sydney and Singapore with strong consistency, survives the loss of a Region without manual failover, and requires no capacity management. Which option fits BEST?', [
  ['Amazon Aurora Global Database with write forwarding.', 0, 'One primary Region accepts writes; failover is a promotion step.'],
  ['Amazon Aurora DSQL in a multi-Region configuration.', 1, 'Serverless distributed SQL with active-active, strongly consistent multi-Region writes.'],
  ['Amazon RDS Multi-AZ with a cross-Region read replica.', 0, 'Single writer and manual promotion.'],
  ['Amazon DynamoDB global tables.', 0, 'Active-active, but not relational SQL.']
], 'service/aurora-dsql');
Q('sap-018', '1.5', 'medium', 'A company is building a data lake on Amazon S3 used by five business units. Analysts in each unit may see only certain tables, and personal data columns must be hidden from most users, whichever query engine they use. What should the architect implement?', [
  ['A bucket policy per analyst.', 0, 'Bucket policies cannot restrict columns and do not scale.'],
  ['AWS Lake Formation permissions with column-level and tag-based access control over the Glue Data Catalog.', 1, 'Central, fine-grained permissions enforced by Athena, Redshift Spectrum and EMR.'],
  ['Separate copies of the data for each business unit.', 0, 'Duplicates storage and governance work.'],
  ['Amazon Macie.', 0, 'Finds sensitive data; it does not control query access.']
], 'service/lake-formation');
Q('sap-019', '1.5', 'medium', 'A company runs Redis as a cache and a separate relational table to keep the same shopping-cart data durable, with custom code to keep them in sync. The team wants to simplify while keeping microsecond reads and no data loss on node failure. Which service should replace both?', [
  ['Amazon ElastiCache without replicas.', 0, 'Data is lost on node failure.'],
  ['Amazon MemoryDB.', 1, 'Redis-compatible, in-memory speed with a durable multi-AZ transaction log.'],
  ['Amazon DynamoDB Accelerator.', 0, 'A cache for DynamoDB only.'],
  ['Amazon Redshift.', 0, 'A data warehouse.']
], 'service/memorydb');
Q('sap-020', '1.5', 'hard', 'An IoT platform ingests 200,000 sensor readings per second. Operations staff query the last few hours constantly; analysts occasionally query years of history. Storage cost must fall automatically as data ages. Which design is MOST appropriate?', [
  ['Insert every reading into Amazon RDS for PostgreSQL.', 0, 'A single relational instance will not sustain this write rate economically.'],
  ['Ingest through Amazon Kinesis Data Streams into a time-series database for recent data, and deliver the stream through Amazon Data Firehose to S3 in Parquet for long-term analysis with Athena.', 1, 'Purpose-built hot store for recent queries and low-cost columnar history in S3.'],
  ['Write each reading as a separate object in S3 Standard.', 0, 'Billions of tiny objects and request charges, with no fast recent-data queries.'],
  ['Store everything in Amazon ElastiCache.', 0, 'Memory is the most expensive place to keep years of data.']
], 'service/timestream');
Q('sap-021', '1.3', 'medium', 'A media company has 300 TB of video on premises to move to Amazon S3 within three weeks. Its internet link is 200 Mbps and is shared with production traffic. Which approach is MOST likely to meet the deadline?', [
  ['AWS DataSync over the existing link.', 0, 'At 200 Mbps, 300 TB takes roughly five months even at full utilisation.'],
  ['An offline transfer: ship the data on storage devices, or carry it to an AWS Data Transfer Terminal.', 1, 'Physical transfer avoids the bandwidth limit and fits a three-week window.'],
  ['S3 Transfer Acceleration.', 0, 'Still bounded by the 200 Mbps uplink.'],
  ['A Site-to-Site VPN.', 0, 'Uses the same constrained link.']
], 'service/snow-family');
Q('sap-022', '1.1', 'medium', 'A company wants several AWS accounts to deploy workloads into subnets that a central networking team owns and controls, so that application teams cannot change routing or create internet gateways. What should be used?', [
  ['VPC sharing through AWS Resource Access Manager.', 1, 'Participants create resources in shared subnets while the owner controls the network.'],
  ['VPC peering from each account.', 0, 'Each account still owns and controls its own VPC.'],
  ['A copy of the VPC in every account built with CloudFormation.', 0, 'Teams could alter their own copies.'],
  ['AWS Client VPN.', 0, 'Remote user access.']
], 'service/ram');

/* ---- Domain 2: Design Secure and Compliant Solutions ---- */
Q('sap-023', '2.1', 'medium', 'A company with 80 accounts wants to stop using long-lived access keys in its GitHub Actions pipelines, which deploy to many accounts. Which approach should replace the keys?', [
  ['Store the access keys in GitHub secrets and rotate them quarterly.', 0, 'Still long-lived secrets outside AWS.'],
  ['Configure GitHub as an OIDC identity provider in IAM and let workflows assume a role whose trust policy restricts the repository and branch.', 1, 'Short-lived credentials per run, with no stored secret.'],
  ['Create one IAM user with administrator access shared by all pipelines.', 0, 'The worst case: one static, all-powerful credential.'],
  ['Use the root user of the management account.', 0, 'Never appropriate.']
], 'service/iam');
Q('sap-024', '2.1', 'hard', 'A multi-tenant SaaS application stores each tenant\'s documents under a tenant-specific prefix in one S3 bucket. Application code runs under one IAM role. A penetration test showed a bug could let one tenant read another\'s files. Which control gives the STRONGEST isolation while keeping one bucket?', [
  ['Validate the tenant ID more carefully in application code only.', 0, 'A single code bug still exposes all tenants.'],
  ['For each request, assume a role with a session policy or session tags scoped to the tenant\'s prefix, and use those credentials for S3 calls.', 1, 'IAM itself enforces the tenant boundary, so a code defect cannot cross it.'],
  ['Enable S3 versioning.', 0, 'Protects against overwrite, not cross-tenant reads.'],
  ['Encrypt the bucket with SSE-S3.', 0, 'Any principal with read access still decrypts transparently.']
], 'service/iam');
Q('sap-025', '2.1', 'medium', 'A company\'s application needs fine-grained authorisation rules such as "an adjuster may approve claims under $10,000 in their own region". Rules change often and auditors want every decision logged. Developers currently hard-code checks across twenty services. Which service should centralise this?', [
  ['Amazon Cognito user pool groups alone.', 0, 'Groups cover coarse roles, not attribute-based rules on resources.'],
  ['Amazon Verified Permissions with Cedar policies.', 1, 'A central policy store and decision API with audit logging.'],
  ['IAM policies for each application user.', 0, 'IAM governs AWS API access, not business rules for end users.'],
  ['AWS WAF rules.', 0, 'Filters web requests; knows nothing of claims or users\' roles.']
], 'service/verified-permissions');
Q('sap-026', '2.1', 'hard', 'On-premises batch servers upload files to Amazon S3 using IAM user access keys stored on disk. The security team wants to eliminate the keys. The company runs its own certificate authority. Which solution is MOST appropriate?', [
  ['Rotate the keys every 30 days with a script.', 0, 'Keys still exist on disk.'],
  ['Use IAM Roles Anywhere so the servers exchange X.509 certificates for temporary credentials.', 1, 'Workloads outside AWS get short-lived role credentials through the existing PKI.'],
  ['Make the bucket public for the servers\' IP range.', 0, 'IP-based public access is weak and exposes the bucket.'],
  ['Install the SSM Agent.', 0, 'Makes the servers manageable; it is not the standard way to give applications S3 credentials.']
], 'service/roles-anywhere');
Q('sap-027', '2.2', 'medium', 'A company replicates encrypted S3 data from Sydney to a DR Region. After a failover test, applications in the DR Region could not decrypt replicated objects. What is the MOST likely fix?', [
  ['Use the same AWS managed key ID in both Regions.', 0, 'AWS managed keys are Region-specific and cannot be shared.'],
  ['Configure replication to re-encrypt with a KMS key in the destination Region and grant the DR application roles permission to use that key.', 1, 'Keys are Regional; the replica needs a destination key the DR roles can use (or multi-Region keys).'],
  ['Disable encryption on the destination bucket.', 0, 'Violates the encryption requirement.'],
  ['Enable S3 Transfer Acceleration.', 0, 'Unrelated to decryption.']
], 'service/kms');
Q('sap-028', '2.2', 'hard', 'A regulator requires that a company can make its data in AWS unreadable immediately by revoking keys it holds outside AWS, and that key material never resides in AWS. Which option meets the requirement, and what trade-off must the architect raise?', [
  ['KMS customer managed keys with automatic rotation; no trade-off.', 0, 'Key material is generated and held inside AWS KMS.'],
  ['A KMS external key store backed by the company\'s own key manager; availability and latency of AWS services now depend on that external system.', 1, 'Keys stay outside AWS and can be cut off, at the cost of an external dependency for every cryptographic operation.'],
  ['SSE-S3; no trade-off.', 0, 'AWS owns and manages the keys.'],
  ['Imported key material in KMS; keys never reside in AWS.', 0, 'Imported material is stored inside KMS, even though you can delete it.']
], 'service/kms');
Q('sap-029', '2.2', 'medium', 'A security architect wants to guarantee that S3 buckets across the organisation can never be accessed by principals outside the organisation, regardless of mistakes in individual bucket policies. Which control is MOST appropriate?', [
  ['A service control policy.', 0, 'SCPs limit what your principals do; they do not stop external principals reaching your resources.'],
  ['A resource control policy that denies S3 access unless aws:PrincipalOrgID matches the organisation (with exceptions for AWS services).', 1, 'RCPs cap access to resources in member accounts, whoever the caller is.'],
  ['Amazon Macie.', 0, 'Reports on exposure; does not prevent it.'],
  ['S3 Storage Lens.', 0, 'Usage analytics.']
], 'service/organizations');
Q('sap-030', '2.2', 'medium', 'An organisation is assessing "harvest now, decrypt later" risk for data in transit to AWS APIs and for long-lived digital signatures. Which AWS capabilities are relevant? (Choose TWO.)', [
  ['Hybrid post-quantum TLS (ML-KEM) on supported AWS service endpoints.', 1, 'Protects key exchange against future quantum attacks.'],
  ['Post-quantum signature key types (ML-DSA) in AWS KMS.', 1, 'Quantum-resistant digital signatures.'],
  ['AWS Shield Advanced.', 0, 'DDoS protection.'],
  ['S3 Object Lock.', 0, 'Immutability, not cryptographic strength.'],
  ['Amazon GuardDuty Malware Protection.', 0, 'Malware scanning.']
], 'service/kms');
Q('sap-031', '2.3', 'medium', 'A security team needs GuardDuty, Security Hub and Inspector enabled in every existing and future account, with findings visible in one place, without using the management account for daily work. What should be configured?', [
  ['Sign in to each account and enable the services manually.', 0, 'Does not cover future accounts and does not scale.'],
  ['Designate a security account as delegated administrator for each service in AWS Organizations and enable auto-enrolment for all members.', 1, 'Central administration from a dedicated account, with new accounts included automatically.'],
  ['Run all security tooling from the management account.', 0, 'Best practice keeps the management account almost unused.'],
  ['Email findings from each account to a shared mailbox.', 0, 'No central control or correlation.']
], 'service/guardduty');
Q('sap-032', '2.3', 'hard', 'A company is designing its organisational unit structure. Requirements: production and non-production isolated by different guardrails; a place for centralised logs that workload administrators cannot alter; a place where teams may experiment freely but with spending limits and no access to corporate networks. Which structure fits BEST?', [
  ['One OU containing every account, with tags to distinguish them.', 0, 'SCPs attach to OUs and accounts, not tags, so guardrails cannot differ.'],
  ['A Security OU with log archive and audit accounts; Workloads OU split into Prod and Non-Prod; a Sandbox OU with restrictive network SCPs and budgets.', 1, 'Matches guardrails to purpose and isolates logs in dedicated accounts.'],
  ['One account per Region.', 0, 'Regions are not the isolation requirement.'],
  ['All workloads in the management account with IAM boundaries.', 0, 'SCPs do not apply there, and blast radius is maximal.']
], 'service/control-tower');
Q('sap-033', '2.3', 'medium', 'Central IT wants project teams to provision only pre-approved, compliant database and network stacks themselves, without granting them broad IAM permissions to create the underlying resources. Which service enables this?', [
  ['AWS Service Catalog with launch constraints.', 1, 'Users launch approved products; a launch role holds the permissions.'],
  ['AWS Trusted Advisor.', 0, 'Advisory checks only.'],
  ['IAM Access Analyzer.', 0, 'Analyses access; does not provision.'],
  ['AWS Budgets.', 0, 'Cost alerts.']
], 'service/service-catalog');
Q('sap-034', '2.4', 'hard', 'A New Zealand financial services company must demonstrate that customer data is stored and processed only in approved Regions, and must detect any drift. Which combination provides preventive and detective coverage? (Choose TWO.)', [
  ['An SCP (or Control Tower Region deny control) that blocks service use outside approved Regions.', 1, 'Preventive: resources cannot be created elsewhere.'],
  ['AWS Config rules or conformance packs aggregated organisation-wide to report resources and settings that violate the residency policy.', 1, 'Detective: continuous evidence and drift detection.'],
  ['Amazon CloudFront geo-restriction.', 0, 'Limits who can view content, not where data is stored.'],
  ['AWS Shield Advanced.', 0, 'DDoS protection.'],
  ['A wiki page listing the approved Regions.', 0, 'Documentation is not a control.']
], 'service/organizations');
Q('sap-035', '2.4', 'medium', 'Auditors require an immutable, organisation-wide record of API activity retained for seven years, protected even from administrators of the workload accounts. Which design satisfies this?', [
  ['A trail in each account writing to a bucket in the same account.', 0, 'Local administrators could alter or delete the logs.'],
  ['An organisation trail delivering to an S3 bucket in a dedicated log archive account, with Object Lock in compliance mode and log file validation.', 1, 'Central, tamper-evident and write-once, outside workload accounts.'],
  ['CloudTrail event history.', 0, 'Only 90 days.'],
  ['VPC Flow Logs to CloudWatch.', 0, 'Network metadata, not API activity.']
], 'service/cloudtrail');
Q('sap-036', '2.4', 'medium', 'A company must prove to its PCI DSS assessor that backups of cardholder-data systems exist, are retained for the required period and cannot be deleted early. Which features of AWS Backup support this? (Choose TWO.)', [
  ['AWS Backup Vault Lock in compliance mode.', 1, 'Prevents deletion or shortened retention.'],
  ['AWS Backup Audit Manager reports.', 1, 'Evidence that resources comply with backup controls.'],
  ['Amazon Data Lifecycle Manager fast snapshot restore.', 0, 'A performance feature.'],
  ['S3 Transfer Acceleration.', 0, 'Unrelated.'],
  ['AWS Compute Optimizer.', 0, 'Right-sizing.']
], 'service/backup');
Q('sap-037', '2.5', 'medium', 'A public chatbot built on Amazon Bedrock must never give investment advice, must mask customers\' account numbers in responses, and must resist prompt-injection attempts. Which feature addresses these requirements together?', [
  ['A longer system prompt asking the model to behave.', 0, 'Instructions alone are easily bypassed.'],
  ['Amazon Bedrock Guardrails with denied topics, sensitive information filters and prompt attack detection.', 1, 'Configurable policy enforcement applied to inputs and outputs, independent of the model.'],
  ['AWS WAF SQL injection rules.', 0, 'A different class of attack and layer.'],
  ['Amazon Macie.', 0, 'Scans S3 for sensitive data.']
], 'service/bedrock');
Q('sap-038', '2.5', 'hard', 'A healthcare company uses a Bedrock knowledge base shared by several departments. Clinicians must retrieve only documents for their own department, and the company must be able to show regulators which prompts and responses were produced. Which measures are MOST appropriate? (Choose TWO.)', [
  ['Apply metadata filters on retrieval tied to the caller\'s department (or separate knowledge bases per department), enforced by the application\'s IAM-scoped role.', 1, 'Restricts retrieval to authorised content.'],
  ['Enable model invocation logging to a protected S3 bucket or CloudWatch Logs with restricted access.', 1, 'Provides an auditable record of prompts and responses.'],
  ['Increase the model temperature.', 0, 'Changes randomness, not access or audit.'],
  ['Allow all departments to query everything and rely on the model to refuse.', 0, 'Models are not an access-control mechanism.'],
  ['Disable CloudTrail to reduce noise.', 0, 'Removes audit evidence.']
], 'service/bedrock');
Q('sap-039', '2.5', 'medium', 'A security team wants to ensure that no application in the organisation can call Amazon Bedrock models without an approved guardrail attached, and that only approved models are used. Which approach enforces this centrally?', [
  ['Ask teams to follow a guideline document.', 0, 'Not enforcement.'],
  ['Use SCPs and IAM policies with Bedrock condition keys that require a specific guardrail on invocation and limit the allowed model IDs.', 1, 'Policy-level enforcement that applications cannot bypass.'],
  ['Enable Amazon GuardDuty.', 0, 'Detects threats; does not enforce guardrail use.'],
  ['Use AWS Budgets actions.', 0, 'Cost controls.']
], 'service/bedrock');
Q('sap-040', '2.3', 'medium', 'A company wants one normalised, queryable store of security logs from all accounts and Regions, plus third-party sources, that its SIEM and its analysts using Athena can both consume. Which service is designed for this?', [
  ['Amazon Security Lake.', 1, 'Centralises and normalises security data to OCSF in S3 with subscriber access.'],
  ['Amazon Detective.', 0, 'Investigation graphs, not a general log lake.'],
  ['AWS Artifact.', 0, 'AWS compliance reports.'],
  ['Amazon Inspector.', 0, 'Vulnerability findings.']
], 'service/security-lake');
Q('sap-041', '2.1', 'medium', 'Employees access internal web applications through a client VPN that grants broad network access. The company wants per-application access decisions based on user identity and device posture, with no VPN client. Which service should be adopted?', [
  ['AWS Verified Access.', 1, 'Evaluates each request against identity and device trust before reaching the application.'],
  ['AWS Client VPN with more authorisation rules.', 0, 'Still network-level access through a client.'],
  ['Amazon Cognito identity pools.', 0, 'Issue AWS credentials to app users.'],
  ['AWS Direct Connect.', 0, 'A private link from a site, not user access control.']

/* ---- Domain 3: Design Cost-Optimized Solutions (the SAP-C03 name for this domain is in the exam data) ---- */
Q('sap-042', '3.1', 'medium', 'A company runs 300 EC2 instances across 25 accounts. Finance bought Standard Reserved Instances for specific instance types three years ago; many are now unused because teams moved to Graviton and Fargate. Commitments are due for renewal. What should the architect recommend?', [
  ['Renew the same Standard Reserved Instances.', 0, 'Repeats the mismatch that left reservations unused.'],
  ['Right-size first, then buy Compute Savings Plans in the management account sized to the steady baseline, shared across the organisation.', 1, 'Flexible across families, Regions, Fargate and Lambda, and applied organisation-wide.'],
  ['Move everything to Spot Instances.', 0, 'Not suitable for all workloads.'],
  ['Buy Savings Plans for 100% of peak usage.', 0, 'Unused commitment is still paid for.']
], 'service/savings-plans');
Q('sap-043', '3.1', 'hard', 'A data processing platform runs a fault-tolerant Spark workload on Amazon EMR for six hours each night. The primary and core nodes hold HDFS metadata and data; task nodes only compute. Which purchasing strategy minimises cost without risking the cluster?', [
  ['Spot Instances for all node types.', 0, 'Losing core nodes loses HDFS data and can fail the job.'],
  ['On-Demand (or Savings Plan covered) primary and core nodes, with Spot task nodes across several instance types.', 1, 'Protects cluster state while using cheap, diversified capacity for stateless compute.'],
  ['Dedicated Hosts.', 0, 'Most expensive, with no benefit here.'],
  ['Reserved Instances for task nodes that run 24 hours a day.', 0, 'The workload runs six hours a night.']
], 'service/emr');
Q('sap-044', '3.1', 'medium', 'An API receives 5 million requests a day at a steady rate around the clock, each taking 200 ms on AWS Lambda at 1 GB. The team asks whether Lambda is still the right choice on cost alone. What is the BEST guidance?', [
  ['Lambda is always the cheapest compute.', 0, 'Not at sustained, steady utilisation.'],
  ['Model the cost: at steady high utilisation, containers on Fargate or EC2 with a Savings Plan often cost less; include operational effort in the comparison.', 1, 'Per-request pricing wins for spiky or low traffic; steady load favours provisioned compute.'],
  ['Move to Dedicated Hosts.', 0, 'For licensing and compliance needs.'],
  ['Increase the memory to 10 GB.', 0, 'Raises cost per millisecond.']
], 'service/lambda');
Q('sap-045', '3.1', 'medium', 'A company\'s Bedrock application generates nightly summaries for two million documents. Results are needed by morning, not in real time. How can inference cost be reduced with the LEAST change?', [
  ['Use batch inference for the nightly job.', 1, 'Batch is priced below on-demand for work that tolerates delay.'],
  ['Buy provisioned throughput for a year.', 0, 'Pays for capacity all day for a nightly job.'],
  ['Call the model synchronously with more concurrency.', 0, 'Same on-demand price and quota pressure.'],
  ['Fine-tune a model.', 0, 'A large effort that does not by itself lower per-token price.']
], 'service/bedrock');
Q('sap-046', '3.1', 'medium', 'Several Java services on x86 EC2 instances are CPU-bound and run all year. The team has spare engineering capacity. Which change is MOST likely to cut compute cost without re-architecting?', [
  ['Move to Graviton-based instances after testing, then cover the baseline with a Savings Plan.', 1, 'Arm instances typically give better price-performance for JVM workloads, and commitments add a further discount.'],
  ['Move to larger x86 instances.', 0, 'More cost.'],
  ['Switch to Dedicated Instances.', 0, 'A premium with no benefit.'],
  ['Enable detailed monitoring.', 0, 'Adds cost.']
], 'service/ec2');
Q('sap-047', '3.2', 'hard', 'A company has 50 VPCs, each with three NAT gateways, mostly used to reach AWS service APIs and a few external SaaS endpoints. NAT hourly and processing charges are the largest network cost. Which redesign reduces cost MOST while keeping private subnets?', [
  ['Add more NAT gateways to spread the load.', 0, 'Increases hourly charges.'],
  ['Add gateway endpoints for S3 and DynamoDB in every VPC, and centralise remaining internet egress through a shared egress VPC reached by the transit gateway.', 1, 'Free endpoints remove the bulk traffic, and consolidating NAT removes most hourly charges.'],
  ['Give every instance a public IP address.', 0, 'Abandons private subnets and adds public IPv4 charges.'],
  ['Replace NAT gateways with a Site-to-Site VPN.', 0, 'Does not provide internet egress.']
], 'service/vpc');
Q('sap-048', '3.2', 'medium', 'A company replicates 5 TB a day from its data centre to Amazon S3 over the internet and also pulls 8 TB a day of analytics results back. A Direct Connect connection already exists for other workloads. What reduces data transfer cost?', [
  ['Route the transfers over Direct Connect using a public or private virtual interface.', 1, 'Data transfer out over Direct Connect is billed at a lower rate than internet egress.'],
  ['Enable S3 Transfer Acceleration.', 0, 'Adds a per-GB fee.'],
  ['Compress nothing and add bandwidth.', 0, 'No cost effect.'],
  ['Use a NAT gateway.', 0, 'Adds processing charges.']
], 'service/direct-connect');
Q('sap-049', '3.2', 'medium', 'A SaaS application returns large JSON responses from an Application Load Balancer to customers worldwide. Data transfer out is a major cost. Which change is MOST likely to reduce it?', [
  ['Put Amazon CloudFront in front, enable compression, and cache cacheable responses.', 1, 'Compression and caching reduce bytes sent from the origin, and CloudFront egress rates are often lower.'],
  ['Add more load balancer nodes.', 0, 'No effect on transfer charges.'],
  ['Move the load balancer to a public subnet in every Region.', 0, 'Multiplies infrastructure.'],
  ['Use AWS Global Accelerator.', 0, 'Adds a transfer premium and does not cache.']
], 'service/cloudfront');
Q('sap-050', '3.2', 'hard', 'Two analytics VPCs in the same Region exchange 40 TB a day through a transit gateway that also connects 60 other VPCs. The transit gateway data processing charge for this flow is significant. What is the MOST appropriate optimisation?', [
  ['Remove the transit gateway entirely.', 0, 'Breaks connectivity for the other 60 VPCs.'],
  ['Add a VPC peering connection between the two analytics VPCs with more specific routes, keeping the transit gateway for everything else.', 1, 'High-volume traffic takes the peering path, which has no processing charge.'],
  ['Move the data through NAT gateways.', 0, 'Adds NAT charges.'],
  ['Create a second transit gateway.', 0, 'Same per-GB charge.']
], 'service/transit-gateway');
Q('sap-051', '3.3', 'medium', 'A company with 120 accounts wants a monthly report of cost by product line. Products span several accounts, and some accounts host several products distinguished by a tag. Which approach gives accurate allocation with the LEAST manual work?', [
  ['Ask each team to email their bill.', 0, 'Manual and inconsistent.'],
  ['Activate cost allocation tags, define AWS Cost Categories that combine account and tag rules, and report on them in Cost Explorer or the Cost and Usage Report.', 1, 'Rule-based grouping across accounts and tags, applied automatically.'],
  ['Create a separate organisation per product.', 0, 'Loses consolidated billing and central governance.'],
  ['Use AWS Budgets only.', 0, 'Alerts, not allocation.']
], 'service/cost-explorer');
Q('sap-052', '3.3', 'medium', 'Finance wants to enforce that every resource carries a "cost-centre" tag with one of a fixed list of values across all accounts. Which combination supports this? (Choose TWO.)', [
  ['A tag policy in AWS Organizations defining the allowed key and values.', 1, 'Standardises tag keys and values organisation-wide.'],
  ['An SCP or IAM condition that denies resource creation without the required tag (aws:RequestTag).', 1, 'Prevents untagged resources from being created where the service supports it.'],
  ['AWS Shield Advanced.', 0, 'Unrelated.'],
  ['Amazon Macie.', 0, 'Unrelated.'],
  ['An S3 lifecycle rule.', 0, 'Unrelated.']
], 'service/organizations');
Q('sap-053', '3.3', 'hard', 'Twelve teams share one Amazon EKS cluster. Finance cannot tell how much each team\'s workloads cost. Which solution provides per-team cost with the LEAST custom tooling?', [
  ['Divide the cluster bill equally by twelve.', 0, 'Does not reflect actual use.'],
  ['Enable split cost allocation data for Amazon EKS in the Cost and Usage Report and label workloads by team or namespace.', 1, 'Allocates cluster compute cost to pods based on requested and used resources.'],
  ['Give each team a separate cluster.', 0, 'Higher cost and operational load just to see a number.'],
  ['Check CloudWatch CPU graphs monthly.', 0, 'Not a billing allocation.']
], 'service/cost-explorer');
Q('sap-054', '3.3', 'medium', 'A sandbox account for experiments must never spend more than a set amount per month. When the limit is reached, new resource creation should be blocked automatically. What should be configured?', [
  ['A CloudWatch dashboard.', 0, 'Displays; does not act.'],
  ['An AWS Budgets action that applies a restrictive IAM policy or SCP when the threshold is reached.', 1, 'Budgets can trigger preventive policies automatically.'],
  ['Cost Explorer forecasts.', 0, 'Informational.'],
  ['A Savings Plan.', 0, 'A discount commitment.']
], 'service/budgets');
Q('sap-055', '3.3', 'medium', 'A sudden spike in a team\'s daily spend went unnoticed for two weeks because it stayed under the monthly budget threshold. Which capability would have flagged it early?', [
  ['AWS Cost Anomaly Detection.', 1, 'Learns normal spend patterns and alerts on unusual changes.'],
  ['AWS Pricing Calculator.', 0, 'Estimates.'],
  ['AWS Artifact.', 0, 'Compliance reports.'],
  ['AWS License Manager.', 0, 'Licence tracking.']
], 'service/cost-explorer');
Q('sap-056', '3.4', 'medium', 'A company holds 900 TB in S3 Standard across thousands of prefixes with very different, unpredictable access patterns. Nobody can maintain lifecycle rules per prefix. Which approach optimises storage cost with the LEAST effort?', [
  ['Move everything to S3 Glacier Deep Archive.', 0, 'Frequently used data becomes unusable and retrievals costly.'],
  ['Move objects to S3 Intelligent-Tiering and enable its archive tiers where retrieval delay is acceptable.', 1, 'Objects are tiered automatically by actual access.'],
  ['Write a script to analyse access logs weekly.', 0, 'Custom work that the storage class already does.'],
  ['Enable versioning.', 0, 'Adds cost.']
], 'service/s3');
Q('sap-057', '3.4', 'hard', 'An Amazon Aurora PostgreSQL cluster\'s bill shows I/O charges exceeding 40% of total database spend for a write-heavy ledger. Instance sizes are appropriate. What should the architect evaluate?', [
  ['Switching the cluster to Aurora I/O-Optimized.', 1, 'Removes per-request I/O charges and is generally cheaper when I/O exceeds roughly a quarter of the bill.'],
  ['Adding more reader instances.', 0, 'Adds instance cost and does not cut write I/O.'],
  ['Moving to Amazon Redshift.', 0, 'Wrong engine for a transactional ledger.'],
  ['Turning off backups.', 0, 'Unsafe and unrelated to I/O charges.']
], 'service/aurora');
Q('sap-058', '3.4', 'medium', 'A company keeps 2,000 gp2 EBS volumes of various sizes. Many need more IOPS than their size provides, so teams over-provision capacity. What is the MOST cost-effective change?', [
  ['Migrate volumes to gp3 and set IOPS and throughput independently of size.', 1, 'gp3 is cheaper per GB and decouples performance from capacity.'],
  ['Migrate all volumes to io2.', 0, 'Far more expensive.'],
  ['Double every volume size.', 0, 'The waste they already have.'],
  ['Use instance store.', 0, 'Not durable.']
], 'service/ebs');
Q('sap-059', '3.4', 'medium', 'A DynamoDB table holds five years of order history. Orders older than 90 days are read a few times a month but must remain queryable in milliseconds. Which change lowers cost?', [
  ['Use the DynamoDB Standard-Infrequent Access table class for the historical data (for example in a separate table).', 1, 'Lower storage price for rarely read items, with the same latency.'],
  ['Add DAX.', 0, 'Adds cost.'],
  ['Increase provisioned capacity.', 0, 'Adds cost.'],
  ['Export everything to Glacier Deep Archive.', 0, 'Not queryable in milliseconds.']
], 'service/dynamodb');
Q('sap-060', '3.4', 'hard', 'A company runs 60 small Amazon RDS for PostgreSQL instances for internal applications, each Multi-AZ, most below 5% CPU. Which options should the architect consider to reduce cost? (Choose TWO.)', [
  ['Consolidate low-use databases onto fewer instances or onto Aurora Serverless v2 that scales with demand.', 1, 'Removes idle instance-hours.'],
  ['Right-size instance classes using Compute Optimizer recommendations and cover the remaining baseline with reserved capacity or a database Savings Plan.', 1, 'Smaller instances plus commitment discounts.'],
  ['Disable automated backups.', 0, 'Removes recoverability.'],
  ['Move every database to io2 storage.', 0, 'Raises cost.'],
  ['Make every instance publicly accessible.', 0, 'A security failure with no saving.']
], 'service/rds');
Q('sap-061', '3.2', 'medium', 'A company\'s workloads in private subnets across 20 VPCs each have their own interface endpoints for ten AWS services, in three Availability Zones. The endpoint hourly charges are substantial. What is a common way to reduce them?', [
  ['Centralise interface endpoints in a shared services VPC and share the private DNS configuration so other VPCs resolve and route to them through the transit gateway.', 1, 'One set of endpoints serves many VPCs, trading hourly charges for transit data processing.'],
  ['Delete the endpoints and use public IP addresses.', 0, 'Abandons the private design.'],
  ['Add endpoints in more Availability Zones.', 0, 'Raises cost.'],
  ['Replace interface endpoints with gateway endpoints for all ten services.', 0, 'Gateway endpoints exist only for S3 and DynamoDB.']
], 'service/privatelink');

/* ---- Domain 4: Design Migration, Modernization and Continuity ---- */
Q('sap-062', '4.1', 'medium', 'A company must leave its data centre in nine months. It has 600 servers; most run packaged software it does not intend to change soon. Which strategy and service fit the bulk of the estate?', [
  ['Refactor every application to serverless before the deadline.', 0, 'Unrealistic for 600 servers in nine months.'],
  ['Rehost with AWS Application Migration Service, in waves planned from discovery data, and modernise selected applications afterwards.', 1, 'Block-level replication moves servers quickly with short cut-over windows.'],
  ['Repurchase every application as SaaS.', 0, 'Not available or practical for all packaged software.'],
  ['Retain everything on premises.', 0, 'The data centre is closing.']
], 'service/mgn');
Q('sap-063', '4.1', 'hard', 'A company wants to move a 4 TB Oracle database to Amazon Aurora PostgreSQL. The application can tolerate at most 30 minutes of downtime. Which sequence is MOST appropriate?', [
  ['Export with Data Pump during a weekend outage and import into Aurora.', 0, 'Engines differ, and the outage far exceeds 30 minutes.'],
  ['Convert the schema and code with AWS SCT or DMS Schema Conversion, run an AWS DMS full load followed by change data capture, validate, then cut over.', 1, 'Schema conversion handles the engine change; CDC keeps the target in sync until a short switch.'],
  ['Use AWS Application Migration Service.', 0, 'Rehosts servers; it does not change database engines.'],
  ['Use AWS DataSync.', 0, 'File and object transfer.']
], 'service/dms');
Q('sap-064', '4.1', 'medium', 'Before planning migration waves, an architect needs to know which on-premises servers communicate with each other and their real CPU and memory use. Which approach provides this?', [
  ['Read the five-year-old CMDB.', 0, 'Likely stale and without network dependencies.'],
  ['Deploy AWS Application Discovery Service agents (or use AWS Transform assessments) to collect utilisation and network connection data.', 1, 'Agent-based discovery captures processes, connections and performance.'],
  ['Ask each team to estimate.', 0, 'Unreliable.'],
  ['Enable AWS Config.', 0, 'Records AWS resources, not on-premises servers.']
], 'service/migration-planning');
Q('sap-065', '4.1', 'medium', 'For each application, match the migration strategy: a CRM replaced by a SaaS product; a Java app moved from WebLogic on a VM to a managed container platform with a managed database; an old reporting tool that nobody uses. Which answer is correct?', [
  ['Repurchase; replatform; retire.', 1, 'Buying SaaS is repurchase, changing the platform with minimal code change is replatform, and switching off unused systems is retire.'],
  ['Rehost; refactor; retain.', 0, 'None of the three matches.'],
  ['Refactor; rehost; relocate.', 0, 'None of the three matches.'],
  ['Retain; repurchase; rehost.', 0, 'None of the three matches.']
], 'service/migration-planning');
Q('sap-066', '4.1', 'hard', 'A company is modernising a large monolith. It wants to move functionality to new services gradually while the monolith keeps running, routing a growing share of requests to the new services. Which pattern and AWS building blocks suit this?', [
  ['A big-bang cut-over on a holiday weekend.', 0, 'High risk and all-or-nothing.'],
  ['The strangler fig pattern: place a routing layer (for example an Application Load Balancer or API Gateway) in front and move routes to new services one at a time.', 1, 'Incremental replacement with easy rollback per route.'],
  ['Copy the monolith into Lambda as one function.', 0, 'Not modernisation, and unlikely to fit Lambda limits.'],
  ['Freeze the monolith for a year while rewriting.', 0, 'Blocks business change.']
], 'service/elb');
Q('sap-067', '4.1', 'medium', 'A company moves 80 TB of NFS file shares to Amazon EFS over a 1 Gbps Direct Connect link and must keep source and destination in step for a month before cut-over. Which service should be used?', [
  ['AWS DataSync with scheduled incremental tasks.', 1, 'Parallel, verified transfers with recurring syncs of changes.'],
  ['AWS Storage Gateway Tape Gateway.', 0, 'Virtual tapes for backup software.'],
  ['AWS DMS.', 0, 'Databases.'],
  ['Manual rsync scripts on one server.', 0, 'Slow, unverified and unmanaged.']
], 'service/datasync');
Q('sap-068', '4.2', 'medium', 'Order these disaster recovery strategies from lowest to highest cost (and from longest to shortest recovery time): warm standby, backup and restore, multi-site active/active, pilot light.', [
  ['Backup and restore; pilot light; warm standby; multi-site active/active.', 1, 'Each step keeps more running in the recovery Region, raising cost and cutting recovery time.'],
  ['Pilot light; backup and restore; multi-site; warm standby.', 0, 'Incorrect order.'],
  ['Warm standby; pilot light; backup and restore; multi-site.', 0, 'Incorrect order.'],
  ['Multi-site; warm standby; pilot light; backup and restore.', 0, 'This is highest to lowest.']
], 'service/backup');
Q('sap-069', '4.2', 'hard', 'A company\'s DR plan fails over to a second Region by running a script that updates Amazon Route 53 records and scales up Auto Scaling groups. During a real Regional event the script failed because control-plane APIs were impaired. How should the design change?', [
  ['Run the script from a third Region.', 0, 'Still depends on control-plane operations at the moment of failure.'],
  ['Rely on data-plane mechanisms: pre-provisioned capacity in the recovery Region and Route 53 health-check-based failover or Application Recovery Controller routing controls.', 1, 'Static stability: recovery does not depend on making changes during the event.'],
  ['Lower the DNS TTL to one second.', 0, 'Does not remove the dependency on API calls.'],
  ['Add more retries to the script.', 0, 'Retries do not help if the API is unavailable.']
], 'service/route53');
Q('sap-070', '4.2', 'medium', 'A company runs 200 Windows and Linux servers on EC2 in one Region and needs recovery in a second Region with an RPO of seconds and RTO of minutes, at low standing cost and without re-architecting. Which service fits?', [
  ['AWS Backup with daily cross-Region copies.', 0, 'RPO of up to a day.'],
  ['AWS Elastic Disaster Recovery.', 1, 'Continuous block-level replication to low-cost staging, with fast launch on demand.'],
  ['Full duplicate fleet running in the second Region.', 0, 'Meets the targets at roughly double the cost.'],
  ['Amazon Data Lifecycle Manager.', 0, 'Snapshot schedules; minutes-to-hours RPO and manual rebuild.']
], 'service/drs');
Q('sap-071', '4.2', 'hard', 'An application uses DynamoDB global tables in two Regions, with stateless services in both behind Amazon Route 53 latency routing. During a Regional impairment, some users saw stale or conflicting data. Which statement BEST explains this and the design consideration?', [
  ['Global tables do not replicate between Regions.', 0, 'They do, asynchronously by default.'],
  ['Default global tables replicate asynchronously with last-writer-wins conflict resolution; the design must tolerate this, pin a user\'s writes to one Region, or use multi-Region strong consistency where its constraints are acceptable.', 1, 'Eventual consistency between Regions is a property the application must be designed for.'],
  ['Route 53 does not support two Regions.', 0, 'It does.'],
  ['DynamoDB loses data when a Region is impaired.', 0, 'Data already replicated is retained; only in-flight writes may lag.']
], 'service/dynamodb');
Q('sap-072', '4.2', 'medium', 'A DR runbook assumes the recovery Region can launch 400 large instances and 50 load balancers on the day. What should the architect verify in advance?', [
  ['That service quotas in the recovery Region match production needs, and consider On-Demand Capacity Reservations for critical capacity.', 1, 'Quotas are per Region, and capacity is not guaranteed without a reservation.'],
  ['That the recovery Region has the same name.', 0, 'Not meaningful.'],
  ['That CloudTrail is disabled in the recovery Region.', 0, 'Counter-productive.'],
  ['Nothing; AWS capacity is unlimited.', 0, 'Quotas and capacity constraints are real, especially during a Regional event.']
], 'service/service-catalog');
Q('sap-073', '4.3', 'medium', 'A team claims its application meets an RTO of 15 minutes and an RPO of 5 minutes but has never tested it. Leadership wants an objective assessment and recommended fixes. Which service should be used first?', [
  ['AWS Resilience Hub.', 1, 'Assesses the architecture against stated RTO and RPO and recommends improvements and tests.'],
  ['AWS Trusted Advisor.', 0, 'General best-practice checks, not RTO and RPO analysis.'],
  ['AWS Cost Explorer.', 0, 'Cost analysis.'],
  ['Amazon Inspector.', 0, 'Vulnerabilities.']
], 'service/resilience-hub');
Q('sap-074', '4.3', 'hard', 'A payments company wants evidence that its multi-AZ service keeps working when one Availability Zone loses power. The test must be safe to run in production with automatic halting if customer impact exceeds a threshold. What should the architect propose?', [
  ['Terminate random instances by hand and watch.', 0, 'Uncontrolled and not a zone-level failure.'],
  ['An AWS Fault Injection Service experiment using the AZ power interruption scenario, with CloudWatch alarm stop conditions.', 1, 'A controlled, repeatable zone failure with automatic rollback criteria.'],
  ['A tabletop exercise only.', 0, 'Useful, but provides no technical evidence.'],
  ['Wait for a real outage.', 0, 'Not a test.']
], 'service/resilience-hub');
Q('sap-075', '4.3', 'hard', 'A service runs across three Availability Zones behind an Application Load Balancer. One zone is degraded: instances pass health checks but respond slowly, hurting a third of requests. What is the fastest safe mitigation?', [
  ['Deploy a new version of the application.', 0, 'A deployment during an incident adds risk and takes time.'],
  ['Start a zonal shift (Application Recovery Controller) to move traffic away from the impaired zone.', 1, 'Shifts traffic within minutes using a data-plane action, provided the other zones have capacity.'],
  ['Delete the load balancer and recreate it.', 0, 'Causes a full outage.'],
  ['Increase the health check interval.', 0, 'Slower detection.']
], 'service/arc');
Q('sap-076', '4.3', 'medium', 'A critical downstream fraud-scoring service sometimes responds slowly, causing the payments API\'s threads to pile up until the API itself fails. Which resiliency patterns should the architect apply? (Choose TWO.)', [
  ['Timeouts with a circuit breaker and a defined fallback (for example, queue for later review).', 1, 'Stops waiting on a failing dependency and degrades gracefully.'],
  ['Retries with exponential backoff and jitter, capped, only for idempotent calls.', 1, 'Avoids retry storms that worsen an overload.'],
  ['Unlimited immediate retries.', 0, 'Amplifies the overload.'],
  ['Remove all timeouts.', 0, 'Guarantees thread exhaustion.'],
  ['Run the API in a single Availability Zone.', 0, 'Reduces resilience.']
], 'service/sqs');
Q('sap-077', '4.3', 'medium', 'An architect is asked to reduce the blast radius of failures and bad deployments for a SaaS platform serving 5,000 customers. Which approach BEST limits how many customers one failure can affect?', [
  ['One large shared stack for all customers.', 0, 'One failure affects everyone.'],
  ['A cell-based architecture: several independent, identical stacks, each serving a subset of customers, with deployments rolled out cell by cell.', 1, 'A failure or bad release is contained within one cell.'],
  ['A bigger database instance.', 0, 'Capacity, not isolation.'],
  ['A longer maintenance window.', 0, 'Unrelated to blast radius.']
], 'service/ecs');
Q('sap-078', '4.2', 'medium', 'A company needs its Amazon S3 data lake available in a second Region with a guaranteed replication time for most objects so that it can state an RPO. Which feature provides this?', [
  ['S3 Cross-Region Replication with Replication Time Control.', 1, 'Backed by a 15-minute replication target with metrics and alerts.'],
  ['S3 Transfer Acceleration.', 0, 'Upload speed.'],
  ['S3 Intelligent-Tiering.', 0, 'Cost tiering.'],
  ['A nightly DataSync job.', 0, 'RPO of up to a day.']
], 'service/s3');
Q('sap-079', '4.1', 'medium', 'A bank exchanges settlement files with partners over SFTP using a self-managed server that is being decommissioned. Partners must keep the same hostname, user names and keys. Files should land in Amazon S3. Which solution has the LEAST operational overhead?', [
  ['AWS Transfer Family with an SFTP endpoint backed by S3, the existing hostname through Route 53, and imported host and user keys.', 1, 'Managed SFTP with no change for partners.'],
  ['An EC2 instance running OpenSSH.', 0, 'A server to patch and scale.'],
  ['Ask partners to use the S3 API.', 0, 'Forces every partner to change.'],
  ['AWS DataSync.', 0, 'Not an SFTP endpoint for partners.']
], 'service/transfer-family');
Q('sap-080', '4.2', 'hard', 'A relational workload on Amazon Aurora requires cross-Region DR with RPO under one second in normal operation and a tested, managed way to switch Regions for planned maintenance with no data loss. Which features should be used?', [
  ['Aurora Global Database with managed switchover for planned events and failover for unplanned ones.', 1, 'Sub-second replication lag typically, with switchover that synchronises before changing roles.'],
  ['Daily snapshot copy.', 0, 'RPO of a day.'],
  ['A cross-Region DMS task.', 0, 'More to operate and typically more lag.'],
  ['Multi-AZ only.', 0, 'Single Region.']
], 'service/aurora');

/* ---- Domain 5: Design for Operational Excellence ---- */
Q('sap-081', '5.1', 'medium', 'A platform team must deploy the same baseline (logging, IAM roles, Config rules) to every account in an organisation, including accounts created in future, in four Regions. Which mechanism should be used?', [
  ['CloudFormation StackSets with service-managed permissions and automatic deployment to target OUs.', 1, 'Deploys and keeps the baseline in all current and future accounts in the OUs.'],
  ['Email the template to each account owner.', 0, 'Manual and unverifiable.'],
  ['A single stack in the management account.', 0, 'Creates resources in one account only.'],
  ['AWS Systems Manager Session Manager.', 0, 'Interactive access.']
], 'service/cloudformation');
Q('sap-082', '5.1', 'hard', 'Engineers sometimes change production resources in the console, and later CloudFormation updates fail or silently revert the changes. Which combination addresses the problem? (Choose TWO.)', [
  ['Remove routine write access to production from humans so changes flow only through the pipeline.', 1, 'Prevents drift at the source.'],
  ['Run CloudFormation drift detection on a schedule and alert on drifted stacks.', 1, 'Detects any drift that still occurs.'],
  ['Stop using infrastructure as code.', 0, 'Abandons repeatability.'],
  ['Disable rollback on stack updates.', 0, 'Leaves stacks in broken states.'],
  ['Give everyone AdministratorAccess to fix issues quickly.', 0, 'The cause of the problem.']
], 'service/cloudformation');
Q('sap-083', '5.1', 'medium', 'A company wants to block deployment of any infrastructure template that creates unencrypted storage or security groups open to the world, before resources are created. Where is the MOST effective place to enforce this?', [
  ['A policy-as-code check on the template or plan in the pipeline (for example CloudFormation Guard or CloudFormation Hooks), failing the build on violations.', 1, 'Prevents non-compliant resources from ever being created.'],
  ['A monthly manual review.', 0, 'Too late and too slow.'],
  ['An AWS Config rule only.', 0, 'Detects after creation; valuable as a second layer but not preventive.'],
  ['A naming convention.', 0, 'Not a control.']
], 'service/cloudformation');
Q('sap-084', '5.1', 'medium', 'A development team prefers defining infrastructure in TypeScript with reusable components and unit tests, while operations requires deployments to go through CloudFormation for change sets and rollback. Which tool satisfies both?', [
  ['AWS CDK.', 1, 'Code in a general-purpose language that synthesises to CloudFormation.'],
  ['Shell scripts calling the AWS CLI.', 0, 'Imperative, with no state or rollback.'],
  ['The AWS Management Console.', 0, 'Manual.'],
  ['AWS Systems Manager Run Command.', 0, 'Runs commands on servers.']
], 'service/cdk');
Q('sap-085', '5.2', 'hard', 'A company deploys to production accounts from a pipeline in a shared tooling account. Security requires that the pipeline has no standing administrator access in production and that container images are scanned and signed before deployment. Which design meets this?', [
  ['Store production administrator access keys in the pipeline.', 0, 'A standing, powerful secret.'],
  ['The pipeline assumes a narrowly scoped deployment role in each production account; the build stage scans images with Amazon Inspector and signs them, and deployment admits only signed images.', 1, 'Short-lived, least-privilege cross-account access, with supply-chain checks before release.'],
  ['Developers deploy from laptops.', 0, 'No control or audit.'],
  ['Scan images once a year.', 0, 'New vulnerabilities appear daily.']
], 'service/codepipeline');
Q('sap-086', '5.2', 'medium', 'A team releases a new Lambda version several times a day and wants to expose it to 10% of traffic for ten minutes, then shift fully, rolling back automatically if errors rise. What should be used?', [
  ['AWS CodeDeploy with a canary deployment configuration and CloudWatch alarms for rollback.', 1, 'Traffic shifting on a Lambda alias with alarm-based automatic rollback.'],
  ['Publish the version and update the alias manually.', 0, 'All at once, with manual rollback.'],
  ['Create a second AWS account for each release.', 0, 'Excessive.'],
  ['Increase the memory setting.', 0, 'Unrelated.']
], 'service/codepipeline');
Q('sap-087', '5.2', 'medium', 'An Amazon ECS service needs releases with instant rollback: the new version must run alongside the old, receive test traffic, then take production traffic only after validation. Which deployment strategy fits?', [

CMP('compute-options', 'EC2 vs ECS vs EKS vs Fargate vs Lambda', 'Five ways to run code, from most control to least management.',

  [
    ['What you manage', 'OS, patching, scaling, everything above the hypervisor', 'Task definitions and services; hosts only if on EC2', 'Kubernetes objects, add-ons, version upgrades; nodes unless Auto Mode or Fargate', 'Nothing below the task', 'Only the function code'],
    ['Unit of work', 'Instance', 'Task (containers)', 'Pod', 'Task or pod', 'Invocation, up to 15 minutes'],
    ['Scales to zero', 'No', 'With Fargate', 'With Fargate or Karpenter', 'Yes', 'Yes'],
    ['Billing', 'Per instance-second', 'Underlying compute', 'Cluster fee + compute', 'vCPU and memory per second', 'Requests + duration'],
    ['Best for', 'Legacy, licensed, GPU, special OS needs', 'Most container services on AWS', 'Kubernetes standardisation and portability', 'Containers with no host work', 'Event-driven, spiky, short tasks']
  ],
  ['<b>Start with Fargate on ECS</b> for a new containerised service unless you have a reason not to.', '<b>Choose Lambda</b> when work is event-driven, short and spiky.', '<b>Choose EKS</b> when Kubernetes is a requirement, not a preference.', '<b>Choose EC2</b> for software that cannot be containerised, needs GPUs or host-level control, or is licensed per host.'],
  'A Kotlin and Spring Boot payments API with steady daytime traffic, a small team and a PCI DSS scope to keep small: ECS on Fargate. No hosts to patch or include in scope, per-task IAM roles and security groups, and no Kubernetes to operate. A nightly reconciliation that runs 40 minutes is a scheduled Fargate task; a webhook handler that fires a few times a minute is Lambda.',
  '"Least operational overhead" with containers means Fargate. "Already uses Kubernetes" or "open-source portability" means EKS. Anything over 15 minutes rules out Lambda. Fargate is not an orchestrator: it always sits under ECS or EKS.');

/* ===== Phase 7: architecture walkthroughs ===== */
/* GRID lays nodes out on a regular grid. rows: [[cell...]], cell = null or [id, label, sub, kind]
   edges: [[from, to, label, dashed]]; groups: [[label, row0, col0, row1, col1, cls]] */
function GRID(rows, edges, caption, groups) {
  const CW = 172, CH = 58, GX = 62, GY = 58, PY = 36, MINCOLS = 4;
  let cols = 0; rows.forEach(row => { cols = Math.max(cols, row.length); });
  const span = n => n * CW + (n - 1) * GX, W = 52 + span(Math.max(cols, MINCOLS)), PX = (W - span(cols)) / 2;
  const nodes = [];
  rows.forEach((row, r) => row.forEach((c, i) => { if (c) nodes.push({ id: c[0], label: c[1], sub: c[2] || undefined, kind: c[3] || 'external', x: PX + i * (CW + GX), y: PY + r * (CH + GY), w: CW, h: CH }); }));
  return {
    w: W, h: PY + rows.length * CH + (rows.length - 1) * GY + 22,
    groups: (groups || []).map(g => ({ label: g[0], cls: g[5], x: PX + g[2] * (CW + GX) - 14, y: PY + g[1] * (CH + GY) - 26, w: (g[4] - g[2] + 1) * CW + (g[4] - g[2]) * GX + 28, h: (g[3] - g[1] + 1) * CH + (g[3] - g[1]) * GY + 40 })),
    nodes, edges: edges.map(e => ({ from: e[0], to: e[1], label: e[2], dashed: e[3] })), caption
  };
}

const CONCEPTS = [];
