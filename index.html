<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Handbook</title>
<meta name="description" content="Unofficial AWS architecture handbook and study guide for the Solutions Architect Associate (SAA-C03) and Professional (SAP-C03) exams. Not affiliated with Amazon Web Services.">
<script>(function(){var t,s;try{t=JSON.parse(localStorage.getItem('awsh:theme'));s=JSON.parse(localStorage.getItem('awsh:size'));}catch(e){}if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;if(s)document.documentElement.dataset.size=s;})();</script>
<style>
/* Reading-first design: system fonts (offline), 17px base, 1.65 line height,
   lines capped near 72 characters, soft neutrals instead of pure black/white. */
:root{
  --fs:17px;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#ECEFF3; --ink:#1C2530; --ink-2:#4A5665;
  --line:#D3D9E0; --accent:#0A5F7A; --accent-ink:#FFFFFF; --accent-bg:#E1F0F5;
  --ok:#1D6B41; --ok-bg:#E2F3E9; --warn:#7A4A00; --warn-bg:#FDF0CF; --bad:#9C2F28; --bad-bg:#FBE6E4;
  --code-bg:#EEF1F4; --mark:#FFE49A;
  --k-network:#DCEBFA; --k-compute:#FCE9D2; --k-data:#DDF2E3; --k-security:#F6DFE4;
  --k-edge:#E9E3F7; --k-external:#E9ECEF; --k-mgmt:#F3EFD6; --k-stroke:#5B6877; --dg-edge:#3F4B59;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --side:18.5rem; --top:3.5rem;
}
html[data-theme="dark"]{
  --bg:#12171D; --surface:#19212A; --surface-2:#212C37; --ink:#E3E8EE; --ink-2:#A9B5C2;
  --line:#313D4A; --accent:#6FC8E4; --accent-ink:#0B1A21; --accent-bg:#16323E;
  --ok:#74D19C; --ok-bg:#15301F; --warn:#F1C36D; --warn-bg:#3A2D10; --bad:#F2938A; --bad-bg:#3C1917;
  --code-bg:#0E1318; --mark:#6B5410;
  --k-network:#1C3550; --k-compute:#4A3418; --k-data:#1C3F2A; --k-security:#4A222C;
  --k-edge:#33294F; --k-external:#2A323B; --k-mgmt:#403A16; --k-stroke:#8D9AA8; --dg-edge:#B4C0CC;
}
html[data-size="s"]{--fs:15.5px} html[data-size="l"]{--fs:19px} html[data-size="xl"]{--fs:21px}
*{box-sizing:border-box}
html{font-size:var(--fs);scroll-padding-top:calc(var(--top) + 1rem)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:50}
.skip:focus{left:.5rem;top:.5rem}

/* Top bar */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:.75rem;
  padding:0 1rem;background:var(--surface);border-bottom:1px solid var(--line);z-index:30}
.brand{font-weight:700;font-size:1.02rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--ink-2);font-weight:500}
.search{flex:1;max-width:32rem;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;font-size:.95rem;padding:.45rem .8rem;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink)}
.iconbtn{font:inherit;font-size:.9rem;line-height:1;min-width:2.4rem;height:2.4rem;padding:0 .6rem;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
#menuBtn{display:none}

/* Sidebar */
#sidebar{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow-y:auto;padding:1rem .75rem 3rem;
  background:var(--surface);border-right:1px solid var(--line);z-index:20;font-size:.95rem;line-height:1.4}
#sidebar h2{font-size:.82rem;font-weight:600;color:var(--ink-2);margin:1.3rem .6rem .35rem}
#sidebar a{display:flex;justify-content:space-between;gap:.5rem;padding:.42rem .6rem;border-radius:7px;color:var(--ink);text-decoration:none}
#sidebar a:hover{background:var(--surface-2)}
#sidebar a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
#sidebar .count{color:var(--ink-2);font-size:.85rem;font-weight:400}

/* Main */
main{margin-left:var(--side);padding:calc(var(--top) + 1.75rem) 2.25rem 4rem;outline:none}
.page{max-width:60rem;margin:0 auto}
.prose,.page>p,.page>ul,.page>ol,.sec>p,.sec>ul,.sec>ol{max-width:72ch}
h1{font-size:1.85rem;line-height:1.2;margin:.2rem 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.3rem;line-height:1.3;margin:2rem 0 .6rem}
h3{font-size:1.08rem;line-height:1.35;margin:1.5rem 0 .4rem}
p{margin:.65rem 0} ul,ol{padding-left:1.35rem;margin:.6rem 0} li{margin:.35rem 0}
.lede{font-size:1.1rem;color:var(--ink-2);max-width:68ch}
.crumbs{font-size:.88rem;color:var(--ink-2);margin-bottom:.4rem}
.crumbs a{color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1rem}
.badge{display:inline-block;font-size:.8rem;line-height:1;padding:.32rem .55rem;border-radius:999px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.badge.in{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.out{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.t1{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.verify{display:inline-block;font-size:.76rem;font-weight:600;line-height:1;padding:.22rem .45rem;border-radius:5px;
  background:var(--warn-bg);color:var(--warn);vertical-align:.08em;cursor:help}
.note{border-left:4px solid var(--accent);background:var(--accent-bg);padding:.7rem 1rem;border-radius:0 8px 8px 0;margin:1rem 0;max-width:72ch}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note p{margin:.3rem 0}

details.sec{border-top:1px solid var(--line);padding:.2rem 0}
details.sec>summary{cursor:pointer;font-weight:650;font-size:1.15rem;padding:.75rem 0;list-style:none;display:flex;align-items:center;gap:.5rem}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"+";display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);font-weight:500;font-size:1rem;flex:none}
details.sec[open]>summary::before{content:"\2212"}
details.sec>.sec{padding-bottom:.9rem}

code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{font-family:var(--mono);font-size:.84rem;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);
  border-radius:8px;padding:.9rem 1rem;overflow-x:auto;tab-size:2}
pre code{background:none;padding:0;font-size:inherit}
.codehead{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--ink-2);margin-top:.8rem}

.tablewrap{overflow-x:auto;margin:.8rem 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.94rem;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:.6rem .8rem;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.8rem;margin:.8rem 0}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 .25rem;font-size:1.02rem}
.card p{margin:0;color:var(--ink-2);font-size:.92rem;line-height:1.5}
.btn{font:inherit;font-size:.95rem;padding:.5rem .95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.8rem 0}
label{font-size:.92rem}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:.95rem;padding:.42rem .6rem;border:1px solid var(--line);
  border-radius:7px;background:var(--surface);color:var(--ink)}
textarea{width:100%;font-family:var(--mono);font-size:.88rem}
.field{display:flex;flex-direction:column;gap:.2rem}
mark{background:var(--mark);color:inherit;padding:0 .1em;border-radius:2px}
.muted{color:var(--ink-2)} .small{font-size:.88rem}
.err{color:var(--bad);font-weight:600}

/* Bars */
.bar{height:.6rem;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:6rem}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.good>i{background:var(--ok)} .bar.poor>i{background:var(--bad)}

/* Diagrams */
figure.diagram{margin:1rem 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem}
.dg-scroll{overflow-x:auto}
.dg-scroll svg{display:block;width:100%;min-width:40rem;height:auto;font-family:var(--font)}
figcaption{font-size:.88rem;color:var(--ink-2);padding:.4rem .4rem .1rem;max-width:72ch}
.dg-group{fill:none;stroke:var(--k-stroke);stroke-width:1.2;stroke-dasharray:6 4}
.dg-group.solid{stroke-dasharray:none;fill:var(--bg)}
.dg-glabel{font-size:12px;font-weight:600;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.dg-glabel.solid{stroke:var(--bg)}
.dg-node{stroke:var(--k-stroke);stroke-width:1.2}
.dg-node.network{fill:var(--k-network)} .dg-node.compute{fill:var(--k-compute)} .dg-node.data{fill:var(--k-data)}
.dg-node.security{fill:var(--k-security)} .dg-node.edge{fill:var(--k-edge)} .dg-node.external{fill:var(--k-external)}
.dg-node.mgmt{fill:var(--k-mgmt)} .dg-node.allow{fill:var(--ok-bg);stroke:var(--ok)} .dg-node.deny{fill:var(--bad-bg);stroke:var(--bad)}
.dg-label{font-size:12.5px;font-weight:600;fill:var(--ink);text-anchor:middle}
.dg-sub{font-size:10.5px;fill:var(--ink-2);text-anchor:middle}
.dg-edge{stroke:var(--dg-edge);stroke-width:1.4;fill:none}
.dg-edge.dashed{stroke-dasharray:5 4}
.dg-arrow{fill:var(--dg-edge)}
.dg-elabel{font-size:10.5px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}

/* Quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin:1rem 0;max-width:50rem}
.q .stem{font-size:1.02rem;margin:0 0 .8rem}
.opt{display:flex;gap:.65rem;align-items:flex-start;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;margin:.45rem 0;cursor:pointer}
.opt:hover{background:var(--surface-2)}
.q.done .opt{cursor:default;pointer-events:none}
.opt input{margin-top:.35rem;flex:none;width:1.05rem;height:1.05rem}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .why{display:block;font-size:.92rem;color:var(--ink-2);margin-top:.25rem}
.qnav{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}
.qnav button{font:inherit;font-size:.82rem;width:2.2rem;height:2rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.qnav button.done{background:var(--accent-bg);border-color:var(--accent)} .qnav button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.qnav button.cur{outline:2px solid var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.6rem;max-width:40rem;min-height:11rem;margin:1rem 0}
.flash .a{border-top:1px dashed var(--line);margin-top:1rem;padding-top:1rem}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;max-width:72ch}
.check input{margin-top:.4rem;width:1.05rem;height:1.05rem;flex:none}
footer.rev{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}

@media (max-width:900px){
  #menuBtn{display:inline-block}
  #sidebar{transform:translateX(-100%);transition:transform .18s ease;width:min(20rem,88vw);box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  body.nav-open #sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  main{margin-left:0;padding:calc(var(--top) + 1.1rem) 1rem 3rem}
  .brand span{display:none}
  h1{font-size:1.55rem}
}
@media (max-width:700px){
  :root{--top:6.4rem}
  .topbar{flex-wrap:wrap;height:var(--top);padding:.5rem .75rem;gap:.5rem;align-content:center}
  .brand{margin-right:auto}
  .sizebtn{display:none}
  .search{order:9;flex:1 0 100%;max-width:none;margin:0}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
@media print{
  .topbar,#sidebar,.noprint{display:none!important}
  main{margin:0;padding:0} body{background:#fff;color:#000;font-size:11pt}
  details.sec>summary::before{display:none} a{color:inherit;text-decoration:none}
  figure.diagram,.q,pre,.tablewrap{break-inside:avoid}
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.row>.field{min-width:0;flex:1 1 9rem;max-width:100%}.field select,.field input{max-width:100%;min-width:0}

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" data-act="menu" aria-label="Open or close the menu">Menu</button>
  <a class="brand" href="#home">AWS Handbook <span>and Exam Centre</span></a>
  <div class="search" role="search">
    <label class="sr" for="q">Search the handbook</label>
    <input type="search" id="q" placeholder="Search everything (press / )" autocomplete="off">
  </div>
  <button class="iconbtn sizebtn" data-act="size" data-d="-1" aria-label="Smaller text" title="Smaller text">A−</button>
  <button class="iconbtn sizebtn" data-act="size" data-d="1" aria-label="Larger text" title="Larger text">A+</button>
  <button class="iconbtn" id="themeBtn" data-act="theme">Dark mode</button>
</header>
<nav id="sidebar" aria-label="Handbook sections"></nav>
<main id="main" tabindex="-1"></main>
<script>
/* ===== Exam data. Source: AWS exam guides on docs.aws.amazon.com, read 18 November 2026. ===== */
const REVIEWED = '18 November 2026';

const EXAMS = {
  saa: {
    key: 'saa', route: 'saa-c03', code: 'SAA-C03', name: 'Solutions Architect – Associate',
    total: 65, scored: 50, unscored: 15, minutes: 130, pass: 720, fee: 'US$150', factsVerify: false,
    guide: 'Exam guide version 1.1, published 29 October 2026. The only content change was removing Amazon Elastic Transcoder from the in-scope list.',
    guideUrl: 'https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.html',
    certUrl: 'https://aws.amazon.com/certification/certified-solutions-architect-associate/',
    candidate: 'At least 1 year of hands-on experience designing cloud solutions that use AWS services.',
    validates: ['Design solutions that incorporate AWS services to meet current business requirements and future projected needs.',
      'Design architectures that are secure, resilient, high-performing, and cost-optimized.',
      'Review existing solutions and determine improvements.'],
    domains: [
      { n: 1, name: 'Design Secure Architectures', weight: 30,
        focus: 'Who can reach what. Identity and access across accounts, network-level protection for workloads, and protecting data at rest and in transit.',
        tasks: [ { id: '1.1', name: 'Design secure access to AWS resources' },
                 { id: '1.2', name: 'Design secure workloads and applications' },
                 { id: '1.3', name: 'Determine appropriate data security controls' } ] },
      { n: 2, name: 'Design Resilient Architectures', weight: 26,
        focus: 'Systems that keep working when a component, an Availability Zone or a dependency fails, and that scale by decoupling.',
        tasks: [ { id: '2.1', name: 'Design scalable and loosely coupled architectures' },
                 { id: '2.2', name: 'Design highly available and/or fault-tolerant architectures' } ] },
      { n: 3, name: 'Design High-Performing Architectures', weight: 24,
        focus: 'Choosing the storage, compute, database, network and data-ingestion option that fits the stated performance need.',
        tasks: [ { id: '3.1', name: 'Determine high-performing and/or scalable storage solutions' },
                 { id: '3.2', name: 'Design high-performing and elastic compute solutions' },
                 { id: '3.3', name: 'Determine high-performing database solutions' },
                 { id: '3.4', name: 'Determine high-performing and/or scalable network architectures' },
                 { id: '3.5', name: 'Determine high-performing data ingestion and transformation solutions' } ] },
      { n: 4, name: 'Design Cost-Optimized Architectures', weight: 20,
        focus: 'Meeting the requirement at the lowest cost: storage classes, purchase options, right-sizing, and avoiding data transfer charges.',
        tasks: [ { id: '4.1', name: 'Design cost-optimized storage solutions' },
                 { id: '4.2', name: 'Design cost-optimized compute solutions' },
                 { id: '4.3', name: 'Design cost-optimized database solutions' },
                 { id: '4.4', name: 'Design cost-optimized network architectures' } ] }
    ]
  },
  sap: {
    key: 'sap', route: 'sap-c03', code: 'SAP-C03', name: 'Solutions Architect – Professional',
    total: 75, scored: 65, unscored: 10, minutes: 180, pass: 720, fee: 'US$300', factsVerify: true,
    guide: 'SAP-C03 replaced SAP-C02 on 17 November 2026. It has five domains (C02 had four) and adds AI integration, multi-tenancy, post-quantum cryptography and more.',
    guideUrl: 'https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-professional-03/solutions-architect-professional-03.html',
    certUrl: 'https://aws.amazon.com/certification/certified-solutions-architect-professional/',
    candidate: '2 or more years of experience using AWS services to design and implement cloud solutions, including guidance that spans multiple applications and projects in a complex, multi-account organisation.',
    validates: ['Design architectures built for the cloud with AI/ML integration.',
      'Design security, compliance, and governance architectures.',
      'Design cost-optimized architectures.',
      'Design for resilience, migration, and business continuity.',
      'Design for operational excellence and automation.'],
    notTested: ['In-depth knowledge of operating systems', 'AI/ML model training, fine-tuning, and data science workflows',
      'Security incident forensics and detailed threat investigation', 'Application code development and debugging'],
    domains: [
      { n: 1, name: 'Architecture Design and Implementation Built for the Cloud', weight: 25,
        focus: 'Designing whole systems: serverless and containers, event-driven patterns, AI integration, hybrid, networking, and data platforms.',
        tasks: [ { id: '1.1', name: 'Design architectures built for the cloud' },
                 { id: '1.2', name: 'Integrate AI and ML services into architectures' },
                 { id: '1.3', name: 'Design hybrid cloud integration patterns' },
                 { id: '1.4', name: 'Design network architectures' },
                 { id: '1.5', name: 'Design data, storage, and database architectures' } ] },
      { n: 2, name: 'Security, Compliance, and Governance', weight: 25,
        focus: 'Security at organisation scale: identity federation, encryption strategy, multi-account guardrails, compliance evidence, and controls for AI.',
        tasks: [ { id: '2.1', name: 'Design identity security architectures' },
                 { id: '2.2', name: 'Design solutions to implement encryption and key management strategies' },
                 { id: '2.3', name: 'Design multi-account governance and compliance solutions' },
                 { id: '2.4', name: 'Design architectures to meet compliance requirements' },
                 { id: '2.5', name: 'Design security and responsible AI controls' } ] },
      { n: 3, name: 'Cost-Optimized Architecture Design', weight: 15,
        focus: 'Cost as a design input: pricing models, data transfer, cost allocation across accounts, and storage and database spend.',
        tasks: [ { id: '3.1', name: 'Design architectures based on AWS pricing models' },
                 { id: '3.2', name: 'Optimize data transfer and network costs' },
                 { id: '3.3', name: 'Design cost allocation and visibility solutions' },
                 { id: '3.4', name: 'Optimize storage and database costs' } ] },
      { n: 4, name: 'Resilience, Migration, and Business Continuity', weight: 15,
        focus: 'Moving workloads to AWS and keeping them running: migration strategies, disaster recovery, backup, and resilience testing.',
        tasks: [ { id: '4.1', name: 'Design migration strategies by using AWS frameworks' },
                 { id: '4.2', name: 'Design disaster recovery architectures' },
                 { id: '4.3', name: 'Design solutions to meet business continuity and resiliency requirements' } ] },
      { n: 5, name: 'Operational Excellence and Automation', weight: 20,
        focus: 'Running it well: infrastructure as code, deployment pipelines with security checks, observability, and safe automated remediation.',
        tasks: [ { id: '5.1', name: 'Design infrastructure as code' },
                 { id: '5.2', name: 'Design CI/CD and DevSecOps pipelines' },
                 { id: '5.3', name: 'Design observability and monitoring solutions' },
                 { id: '5.4', name: 'Design operational automation and resilient systems' } ] }
    ]
  }
};

/* Official in-scope and out-of-scope lists, copied from the exam guides. Both guides call the lists non-exhaustive. */
const SCOPE = {
  saa: {

  id: 'vpc', name: 'Amazon VPC', category: 'networking', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['Amazon VPC'],
  summary: 'Your own isolated network inside an AWS Region: IP ranges, subnets, routing and traffic filtering.',
  what: `<p>A virtual private cloud (VPC) is a logically isolated network in one AWS Region, owned by your account. You choose its IP address ranges, divide it into subnets, and decide which subnets can reach the internet, other networks, or nothing at all. Almost every other resource you run (EC2 instances, ECS tasks, RDS databases, load balancers) gets a network interface inside a VPC.</p>`,
  problem: `<p>Without a VPC, every resource would sit on a shared network with only application-level protection. A VPC gives you network-level control: private addressing, separation between tiers (web, application, database), a controlled path in from the internet, a controlled path out, and private links to your offices or data centres.</p>`,
  how: `<ul>
<li><b>Address space.</b> A VPC has a primary IPv4 CIDR block between <code>/16</code> (65,536 addresses) and <code>/28</code> (16 addresses). You cannot change the primary block later, but you can add secondary blocks. IPv6 is optional (dual-stack), and IPv6-only subnets are supported.</li>
<li><b>Subnets.</b> A VPC spans every Availability Zone in its Region. A subnet lives in exactly one AZ and has a CIDR block carved from the VPC range. A subnet cannot be resized after creation. AWS reserves 5 addresses in every subnet: the network address, the VPC router (+1), DNS (+2), one for future use (+3) and the last address.</li>
<li><b>Route tables.</b> Every subnet is associated with exactly one route table. A <code>local</code> route for the VPC range always exists, so everything inside the VPC can route to everything else. The most specific matching route wins.</li>
<li><b>What makes a subnet public.</b> Only its route table. A <i>public</i> subnet has a default route (<code>0.0.0.0/0</code>) to an internet gateway, and resources in it need a public IPv4 address to be reachable. A <i>private</i> subnet has a default route to a NAT gateway, so it can start outbound connections but cannot be reached from the internet. An <i>isolated</i> subnet has no default route.</li>
<li><b>Internet gateway (IGW).</b> One per VPC, horizontally scaled, no charge. It performs one-to-one address translation for resources that have public IPs.</li>
<li><b>NAT gateway.</b> A managed device placed in a public subnet with an Elastic IP. It lets private subnets reach the internet without accepting inbound connections. A standard NAT gateway lives in one AZ, so resilient designs use one per AZ. A regional NAT gateway mode that spans AZs was announced in late 2025 [[verify]].</li>
<li><b>Security groups.</b> Stateful firewalls attached to network interfaces. Allow rules only. Return traffic is allowed automatically. A rule can name another security group as its source, which is how you say "only the load balancer may call the application".</li>
<li><b>Network ACLs.</b> Stateless filters on a subnet boundary. Numbered allow and deny rules, evaluated lowest number first. Because they are stateless you must allow return traffic on ephemeral ports (1024 to 65535).</li>
<li><b>VPC endpoints.</b> Private access to AWS services without the internet. <i>Gateway endpoints</i> (S3 and DynamoDB only) are route table entries and cost nothing. <i>Interface endpoints</i> (AWS PrivateLink) are network interfaces with private IPs in your subnets, billed per hour and per GB.</li>
<li><b>DNS.</b> The Route 53 Resolver answers at the VPC base address plus two. <code>enableDnsSupport</code> and <code>enableDnsHostnames</code> must both be on for private hosted zones and interface endpoint private DNS to work.</li>
<li><b>Default quotas</b> [[verify]] (most can be raised): 5 VPCs per Region, 200 subnets per VPC, 5 IPv4 CIDR blocks per VPC, 60 inbound and 60 outbound rules per security group, 5 security groups per network interface, 20 rules per direction in a network ACL.</li>
</ul>`,
  features: [
    `<b>Secondary CIDR blocks</b>: extend a VPC that is running out of addresses.`,
    `<b>IPv6 and dual-stack</b>, with an <b>egress-only internet gateway</b> for outbound-only IPv6.`,
    `<b>Gateway and interface endpoints</b>: keep traffic to AWS services off the internet and off the NAT gateway bill.`,
    `<b>VPC Flow Logs</b>: metadata for accepted and rejected traffic, at VPC, subnet or interface level, sent to CloudWatch Logs, S3 or Data Firehose.`,
    `<b>VPC sharing</b> (through AWS RAM): one account owns the VPC, other accounts in the organisation launch resources into its subnets.`,
    `<b>IP Address Manager (IPAM)</b>: plan and track CIDR allocations across accounts and Regions.`,
    `<b>Reachability Analyzer</b> and <b>Network Access Analyzer</b>: prove whether a path exists without sending traffic.`,
    `<b>VPC Block Public Access</b>: an account-level or organisation-level switch that blocks internet gateway traffic regardless of route tables.`,
    `<b>Traffic Mirroring</b>: copy packets to inspection tools.`
  ],
  when: [
    `Any workload that runs on EC2, ECS, EKS, RDS, ElastiCache or behind a load balancer. In practice, always.`,
    `When tiers need different exposure: public entry point, private application, isolated database.`,
    `When you need private connectivity to on-premises networks (Site-to-Site VPN, Direct Connect) or to other VPCs.`
  ],
  whenNot: [
    `<b>Do not use the default VPC for production.</b> Its subnets are all public. Create a purpose-built VPC.`,
    `<b>Do not build a mesh of VPC peering connections</b> once you have more than a handful of VPCs. Peering is not transitive. Use Transit Gateway.`,
    `<b>Do not attach a Lambda function to a VPC unless it needs something private</b> (such as an RDS database). A VPC-attached function loses direct internet access and needs a NAT gateway or endpoints to call AWS APIs.`,
    `<b>Do not expose one service to another VPC by peering the whole network</b> when a single PrivateLink endpoint service would do.`
  ],
  interactions: [
    `<b>EC2, ECS, EKS, RDS, ElastiCache, Lambda (VPC-attached):</b> each gets elastic network interfaces in your subnets, protected by your security groups.`,
    `<b>Elastic Load Balancing:</b> load balancer nodes live in the subnets you choose, one per AZ.`,
    `<b>Route 53:</b> private hosted zones resolve only inside associated VPCs; Resolver endpoints connect DNS to on-premises.`,
    `<b>Transit Gateway, VPC peering, PrivateLink, VPC Lattice:</b> connect VPCs to each other.`,
    `<b>Site-to-Site VPN and Direct Connect:</b> connect a VPC to on-premises through a virtual private gateway or a transit gateway.`,
    `<b>Network Firewall and Gateway Load Balancer:</b> inspect traffic by steering it through an inspection subnet with route tables.`,
    `<b>CloudWatch Logs and S3:</b> destinations for flow logs.`
  ],
  example: {
    title: 'Three-AZ VPC with public, private and isolated subnets (Terraform)', lang: 'hcl',
    code: `data "aws_availability_zones" "available" {
  state = "available"
}

locals {
  azs = slice(data.aws_availability_zones.available.names, 0, 3)
}

resource "aws_vpc" "main" {
  cidr_block           = "10.20.0.0/16"
  enable_dns_support   = true
  enable_dns_hostnames = true
  tags = { Name = "payments-prod" }
}

resource "aws_internet_gateway" "igw" {
  vpc_id = aws_vpc.main.id
}

# Public: 10.20.0.0/24, 10.20.1.0/24, 10.20.2.0/24 (load balancer, NAT)
resource "aws_subnet" "public" {
  count             = 3
  vpc_id            = aws_vpc.main.id
  availability_zone = local.azs[count.index]
  cidr_block        = cidrsubnet(aws_vpc.main.cidr_block, 8, count.index)
}

# Isolated: 10.20.8.0/24, 10.20.9.0/24, 10.20.10.0/24 (database, no default route)
resource "aws_subnet" "isolated" {
  count             = 3
  vpc_id            = aws_vpc.main.id
  availability_zone = local.azs[count.index]
  cidr_block        = cidrsubnet(aws_vpc.main.cidr_block, 8, count.index + 8)
}

# Private: 10.20.16.0/20, 10.20.32.0/20, 10.20.48.0/20 (application tasks)
resource "aws_subnet" "private" {
  count             = 3
  vpc_id            = aws_vpc.main.id
  availability_zone = local.azs[count.index]
  cidr_block        = cidrsubnet(aws_vpc.main.cidr_block, 4, count.index + 1)
}

resource "aws_eip" "nat" {
  count  = 3
  domain = "vpc"
}

resource "aws_nat_gateway" "nat" {
  count         = 3
  allocation_id = aws_eip.nat[count.index].id
  subnet_id     = aws_subnet.public[count.index].id
  depends_on    = [aws_internet_gateway.igw]
}

resource "aws_route_table" "public" {
  vpc_id = aws_vpc.main.id
  route {
    cidr_block = "0.0.0.0/0"
    gateway_id = aws_internet_gateway.igw.id
  }
}

resource "aws_route_table" "private" {
  count  = 3
  vpc_id = aws_vpc.main.id
  route {
    cidr_block     = "0.0.0.0/0"
    nat_gateway_id = aws_nat_gateway.nat[count.index].id
  }
}

resource "aws_route_table_association" "public" {
  count          = 3
  subnet_id      = aws_subnet.public[count.index].id
  route_table_id = aws_route_table.public.id
}

resource "aws_route_table_association" "private" {
  count          = 3
  subnet_id      = aws_subnet.private[count.index].id
  route_table_id = aws_route_table.private[count.index].id
}

# Free gateway endpoint so S3 traffic skips the NAT gateways
resource "aws_vpc_endpoint" "s3" {
  vpc_id            = aws_vpc.main.id
  service_name      = "com.amazonaws.ap-southeast-2.s3"
  vpc_endpoint_type = "Gateway"
  route_table_ids   = aws_route_table.private[*].id
}`,
    notes: `<p>The isolated subnets are left on the VPC's main route table, which has only the local route. In CloudFormation the same resources are <code>AWS::EC2::VPC</code>, <code>AWS::EC2::Subnet</code> and so on; in CDK the <code>ec2.Vpc</code> construct builds this whole layout from a few lines of subnet configuration. The <a href="#tools/cidr">CIDR calculator</a> produces the same address plan.</p>`
  },
  useCases: [
    `<b>Three-tier web application:</b> load balancer in public subnets, application in private subnets, database in isolated subnets.`,
    `<b>Payments platform:</b> the cardholder-data environment sits in its own VPC or its own account, with every path in and out explicit and logged, which keeps PCI DSS scope small.`,
    `<b>Hybrid network:</b> a VPC reachable from head office over Direct Connect, with on-premises DNS resolving AWS private names.`,
    `<b>Shared services:</b> one networking account owns the VPCs and shares subnets with workload accounts.`
  ],
  pricing: `<p>A VPC, its subnets, route tables, security groups, network ACLs and internet gateway cost nothing. You pay for what you attach:</p>
<ul><li><b>NAT gateways:</b> per hour for each gateway, plus per GB processed. Usually the biggest surprise on a network bill.</li>
<li><b>Public IPv4 addresses:</b> charged per hour for every public address, in use or not.</li>
<li><b>Interface endpoints:</b> per hour for each endpoint in each AZ, plus per GB.</li>
<li><b>Data transfer:</b> between AZs, between Regions and out to the internet.</li>
<li><b>Transit Gateway attachments, VPN connections, Traffic Mirroring, Flow Logs</b> (log ingestion and storage).</li></ul>
<p>Main cost levers: gateway endpoints for S3 and DynamoDB, keeping chatty traffic inside one AZ where resilience allows, and interface endpoints once NAT data charges exceed their hourly cost.</p>`,
  pricingLink: 'https://aws.amazon.com/vpc/pricing/',
  alternatives: [
    `There is no alternative to a VPC for VPC-based resources. The real choices are about how VPCs connect: see <a href="#compare/sg-vs-nacl">security groups vs network ACLs</a>, and (in later phases) peering vs Transit Gateway vs PrivateLink.`,
    `<b>One big VPC vs many small ones:</b> separate VPCs (and usually separate accounts) per environment give a stronger boundary than subnets inside one VPC.`
  ],
  mistakes: [
    `<b>Overlapping CIDR ranges</b> between VPCs or with the office network. They cannot be peered or routed later without address translation. Plan ranges centrally.`,
    `<b>A VPC range that is too small.</b> Load balancers, endpoints and containers that take one IP each use addresses quickly.`,
    `<b>One NAT gateway for all AZs.</b> Cheaper, but an AZ failure removes outbound access for everyone, and traffic from other AZs pays cross-AZ charges.`,
    `<b>Databases in public subnets</b>, or security groups open to <code>0.0.0.0/0</code> on SSH (22), RDP (3389) or database ports.`,
    `<b>Using network ACLs as the main firewall.</b> Use security groups for normal control; keep NACLs for coarse subnet rules and explicit denies.`,
    `<b>Forgetting return traffic in a NACL.</b> Stateless means the ephemeral port range must be allowed.`,
    `<b>Sending S3 traffic through NAT</b> when a gateway endpoint is free.`,
    `<b>No flow logs.</b> You cannot investigate what you did not record.`
  ],
  exam: {
    saa: ['1.2', '3.4', '4.4'], sap: ['1.3', '1.4', '3.2'],
    trap: `<ul><li>A private instance needs outbound internet access: the answer is a NAT gateway <i>in a public subnet</i> plus a route, never an internet gateway on the private subnet.</li>
<li>Security groups are stateful and cannot deny. Network ACLs are stateless and can. "Block this IP address" means NACL or WAF.</li>
<li>Gateway endpoints exist only for S3 and DynamoDB and are free. Everything else is an interface endpoint.</li>
<li>VPC peering is not transitive. If A peers with B and B with C, A cannot reach C.</li></ul>`,
    proAdds: `<p>The Professional exam assumes all of the above and asks about scale: dozens of VPCs across accounts joined by Transit Gateway or Cloud WAN, centralised egress and inspection VPCs, shared VPCs, hybrid DNS with Resolver endpoints, Direct Connect resilience, overlapping address ranges after a merger, IPv6 and dual-stack migration, and the data transfer cost of each design.</p>`

  ],
  diagram: DG_VPC
},

  id: 'iam', name: 'AWS Identity and Access Management (IAM)', category: 'security', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['IAM'],
  summary: 'Decides who or what can call which AWS API on which resource, on every request.',
  what: `<p>IAM is the global service that authenticates every call to an AWS API and decides whether to allow it. It has two halves: <b>principals</b> (the root user, IAM users, IAM roles, federated identities and AWS services) and <b>policies</b> (JSON documents that allow or deny actions on resources, optionally under conditions).</p>`,
  problem: `<p>One AWS account can hold hundreds of resources used by people, applications, pipelines and other AWS services. IAM lets each of them hold exactly the permissions it needs, for as short a time as possible, and gives you one place to answer "who could have done this?".</p>`,
  how: `<ul>
<li><b>Every request is denied by default.</b> AWS collects all policies that apply to the request and evaluates them (see the diagram). An explicit <code>Deny</code> in any policy wins over any <code>Allow</code>.</li>
<li><b>Policy types that grant:</b> identity-based policies (attached to users, groups, roles) and resource-based policies (attached to a resource such as an S3 bucket, KMS key or SQS queue, naming who may use it).</li>
<li><b>Policy types that only limit:</b> permissions boundaries (a ceiling for one user or role), service control policies and resource control policies (ceilings for whole accounts, set in AWS Organizations) and session policies (a ceiling for one session). None of these ever grants access.</li>
<li><b>Same account vs cross-account.</b> Inside one account, an Allow in either the identity policy or the resource policy is normally enough. Across accounts, <i>both</i> sides must allow: the resource policy in account B and the identity policy in account A.</li>
<li><b>Roles.</b> A role has no password or keys. It has a <i>trust policy</i> (who may assume it) and permissions policies (what it can do). Assuming a role calls AWS STS, which returns temporary credentials. The default session is 1 hour; a role can allow up to 12 hours; a role assumed from another role (chaining) is limited to 1 hour.</li>
<li><b>How workloads get credentials.</b> EC2 uses an instance profile, ECS a task role, Lambda an execution role. The platform delivers and rotates the temporary credentials; your code never stores keys.</li>
<li><b>Federation.</b> People sign in through IAM Identity Center or a SAML/OIDC identity provider and receive a role session. Pipelines outside AWS (GitHub Actions, GitLab) use OIDC with <code>sts:AssumeRoleWithWebIdentity</code>.</li>
<li><b>Policy language.</b> <code>Effect</code>, <code>Action</code>, <code>Resource</code>, optional <code>Condition</code>, and <code>Principal</code> in resource-based policies. Conditions can test tags (attribute-based access control), source network, MFA, organisation ID and more.</li>
<li><b>Global and eventually consistent.</b> IAM is not tied to a Region. Changes can take a few seconds to apply everywhere.</li>
<li><b>Default quotas</b> [[verify]]: 5,000 users and 1,000 roles per account, 10 managed policies per role, 6,144 characters per managed policy, 2,048 characters per role trust policy.</li>
</ul>`,
  features: [
    `<b>IAM Access Analyzer</b>: finds resources shared outside your account or organisation, finds unused access, validates policies, and generates least-privilege policies from CloudTrail activity.`,
    `<b>Permissions boundaries</b>: let teams create their own roles without being able to exceed a ceiling you set.`,
    `<b>ABAC with tags and session tags</b>: one policy that says "you may act on resources whose <code>project</code> tag matches yours".`,
    `<b>IAM Roles Anywhere</b>: temporary credentials for servers outside AWS, authenticated with X.509 certificates.`,
    `<b>OIDC and SAML identity providers</b>: trust an external issuer instead of creating IAM users.`,
    `<b>Service-linked roles</b>: predefined roles an AWS service needs to act for you.`,
    `<b>Last-accessed information and the credential report</b>: evidence for removing unused permissions and stale keys.`,
    `<b>Centralised root access management</b>: remove root credentials from member accounts in an organisation and perform root-only tasks from a central account.`
  ],
  when: [
    `Always. Every AWS design starts with who can do what.`,
    `<b>Roles</b> for anything that runs: instances, tasks, functions, pipelines, cross-account access.`,
    `<b>Resource-based policies</b> when another account or an AWS service needs access to one specific resource.`,
    `<b>Permissions boundaries</b> when you delegate role creation to development teams.`
  ],
  whenNot: [
    `<b>IAM users for people</b> in anything beyond a single small account. Use IAM Identity Center with your identity provider, so people get short-lived sessions and leave with one switch.`,
    `<b>Long-lived access keys in CI/CD.</b> Use OIDC federation so the pipeline assumes a role for each run.`,
    `<b>IAM for your application's end users.</b> Customer sign-up and sign-in belongs in Amazon Cognito or another identity provider.`,
    `<b>IAM policies for fine-grained rules inside your application</b> ("a teller may view accounts in their branch"). That is application authorisation: Amazon Verified Permissions or your own logic.`,
    `<b>Identity policies to stop administrators.</b> An account admin can edit them. Preventive, account-wide limits belong in service control policies.`
  ],
  interactions: [
    `<b>AWS STS:</b> issues the temporary credentials behind every role session.`,
    `<b>AWS Organizations:</b> service control policies and resource control policies sit above every account's IAM policies.`,
    `<b>IAM Identity Center:</b> creates roles in each account from permission sets and signs people in to them.`,
    `<b>KMS, S3, SQS, SNS, Secrets Manager, Lambda, ECR:</b> have resource-based policies evaluated together with identity policies. KMS key policies are mandatory: IAM alone cannot grant access to a key unless the key policy permits it.`,
    `<b>CloudTrail:</b> records every API call with the principal that made it.`,
    `<b>EC2, ECS, Lambda:</b> receive role credentials automatically through instance profiles, task roles and execution roles.`
  ],
  example: {
    title: 'Trust policy that lets one GitHub repository branch assume a deploy role (no stored keys)', lang: 'json',
    code: `{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Principal": {
        "Federated": "arn:aws:iam::111122223333:oidc-provider/token.actions.githubusercontent.com"
      },
      "Action": "sts:AssumeRoleWithWebIdentity",
      "Condition": {
        "StringEquals": {
          "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
          "token.actions.githubusercontent.com:sub": "repo:my-org/payments-api:ref:refs/heads/main"
        }
      }
    }
  ]
}`,
    notes: `<p>The <code>sub</code> condition is the control that matters: without it, any repository on GitHub could assume the role. The role's permissions policy should then allow only what a deployment needs, for example pushing to one ECR repository and updating one ECS service. In Terraform this is an <code>aws_iam_openid_connect_provider</code> plus an <code>aws_iam_role</code> whose <code>assume_role_policy</code> is the document above.</p>`
  },
  useCases: [
    `<b>Application permissions:</b> the payments API task role may read one secret and write to one queue, nothing else.`,
    `<b>Cross-account deployment:</b> a pipeline in a tooling account assumes a deploy role in the production account.`,
    `<b>Break-glass access:</b> an emergency role that requires MFA, is alarmed in CloudTrail, and is otherwise unused.`,
    `<b>Third-party access:</b> a vendor assumes a role in your account, with an external ID condition so their other customers cannot trick them into using it.`
  ],
  pricing: `<p>IAM, AWS STS and IAM Identity Center have no charge. IAM Access Analyzer's external-access findings are free; its unused-access analysis and custom policy checks are paid features (charged per identity analysed and per check). You still pay for whatever the principals do with their permissions.</p>`,
  pricingLink: 'https://aws.amazon.com/iam/',
  alternatives: [
    `<b>IAM Identity Center</b> for workforce sign-in across accounts (it builds on IAM roles; it does not replace them).`,
    `<b>Amazon Cognito</b> for customers signing in to your application.`,
    `<b>Amazon Verified Permissions</b> for authorisation decisions inside your application.`,
    `<b>Service control policies and resource control policies</b> for organisation-wide limits that account administrators cannot remove.`
  ],
  mistakes: [
    `<b>Using the root user</b> for daily work, or leaving it without MFA.`,
    `<b>Wildcards everywhere:</b> <code>"Action": "*"</code> with <code>"Resource": "*"</code>. Start from the specific actions and resources and widen only when something fails.`,
    `<b>Unrestricted <code>iam:PassRole</code>.</b> Anyone who can pass any role to a service can run code with that role's permissions. Restrict it to named roles.`,
    `<b>Trusting a whole account or <code>*</code> in a trust policy</b> without conditions. For third parties add an external ID; for your own organisation add <code>aws:PrincipalOrgID</code>.`,
    `<b>An OIDC trust policy without a <code>sub</code> condition.</b>`,
    `<b>Assuming an SCP grants access.</b> It never does. The principal still needs an identity or resource policy that allows the action.`,
    `<b>Forgetting the KMS key policy</b> when a role "has permission" but decryption still fails.`,
    `<b>Access keys that never rotate</b>, committed to source control or baked into images.`
  ],
  exam: {
    saa: ['1.1'], sap: ['2.1', '2.3'],
    trap: `<ul><li>An explicit Deny always wins, wherever it is.</li>
<li>"An application on EC2 needs access to S3 securely": an IAM role through an instance profile, never access keys on the instance.</li>
<li>SCPs limit, never grant, and do not apply to the organisation's management account.</li>
<li>Cross-account access needs an Allow on both sides.</li>
<li>"Let developers create roles but never exceed X": a permissions boundary.</li></ul>`,
    proAdds: `<p>The Professional exam moves from single policies to identity architecture: federation with a corporate identity provider, permission sets across many accounts, data perimeters built from SCPs, RCPs and VPC endpoint policies, ABAC to avoid a policy per team, least-privilege cross-account patterns, IAM Roles Anywhere for hybrid workloads, and OAuth 2.0 with Cognito for application users.</p>`
  },
  docs: [
    { label: 'IAM User Guide', url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html' },
    { label: 'Policy evaluation logic', url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html' },
    { label: 'Security best practices in IAM', url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html' }
  ],
  diagram: DG_IAM
},

  id: 'ecs', name: 'Amazon ECS on AWS Fargate', category: 'containers', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['Amazon ECS', 'AWS Fargate'],
  summary: 'Run containers as long-lived services or one-off tasks without managing servers or a Kubernetes control plane.',
  what: `<p>Amazon Elastic Container Service (ECS) is AWS's own container orchestrator: you describe a container workload and ECS starts it, keeps it running, connects it to a load balancer and replaces it when it fails. AWS Fargate is the serverless compute engine underneath: each task runs in its own isolated environment that AWS provisions, patches and retires. Together they give you containers with no EC2 instances to manage.</p>`,
  problem: `<p>Running containers yourself means running a fleet: choosing instance sizes, patching hosts, packing containers onto them, replacing failed nodes and scaling two layers (hosts and containers). ECS on Fargate removes the host layer. You size and scale tasks; AWS handles everything below.</p>`,
  how: `<ul>
<li><b>Task definition.</b> A versioned blueprint: container images, CPU and memory, ports, environment variables, secrets, logging and two IAM roles. Each change creates a new revision.</li>
<li><b>Task.</b> One running copy of a task definition. On Fargate a task gets between 0.25 and 16 vCPU and 0.5 to 120 GB of memory, in fixed combinations, and 20 GiB of ephemeral storage by default (configurable up to 200 GiB).</li>
<li><b>Service.</b> Keeps a desired number of tasks running, spreads them across Availability Zones, registers them with a load balancer target group and performs deployments. A <b>cluster</b> is the logical grouping services and tasks belong to.</li>
<li><b>Networking.</b> Fargate tasks always use <code>awsvpc</code> mode: every task gets its own network interface, private IP and security groups in your subnet. Load balancer target groups must therefore use target type <code>ip</code>.</li>
<li><b>Two roles, often confused.</b> The <i>task execution role</i> is used by ECS itself to pull the image from ECR, write logs and fetch secrets. The <i>task role</i> is what your application code uses to call AWS APIs.</li>
<li><b>Getting the image.</b> A task in a private subnet needs a path to ECR: either a NAT gateway, or interface endpoints for <code>ecr.api</code> and <code>ecr.dkr</code> plus the S3 gateway endpoint (image layers are stored in S3). Add endpoints for CloudWatch Logs and Secrets Manager if the task uses them.</li>
<li><b>Deployments.</b> Rolling updates replace tasks gradually, controlled by minimum healthy and maximum percent. The deployment circuit breaker stops and rolls back a deployment whose tasks keep failing. Blue/green deployments shift traffic between two task sets, through CodeDeploy or ECS's built-in blue/green strategy [[verify]].</li>
<li><b>Scaling.</b> Application Auto Scaling adjusts the desired count, usually with target tracking on CPU, memory or requests per target.</li>
<li><b>Stopping.</b> ECS sends <code>SIGTERM</code>, waits for the stop timeout (30 seconds by default, up to 120 on Fargate), then sends <code>SIGKILL</code>. Fargate Spot tasks receive a two-minute warning before interruption.</li>
<li><b>What Fargate does not offer:</b> GPUs [[verify]], privileged containers, host networking, or the daemon scheduling strategy. Those need ECS on EC2.</li>
</ul>`,
  features: [
    `<b>Capacity providers</b> <code>FARGATE</code> and <code>FARGATE_SPOT</code>: mix on-demand and interruptible capacity with a base and weights.`,
    `<b>Deployment circuit breaker with automatic rollback.</b>`,
    `<b>Secrets injection</b> from Secrets Manager or Parameter Store at task start, so values never appear in the task definition.`,
    `<b>ECS Service Connect</b>: service-to-service discovery and traffic metrics without running your own mesh.`,
    `<b>ECS Exec</b>: open a shell in a running container through Systems Manager, with the session logged.`,
    `<b>Graviton (ARM64) tasks</b>: usually cheaper per vCPU if your image is built for ARM.`,
    `<b>EFS and EBS volumes</b> for tasks that need persistent or larger storage.`,
    `<b>Container Insights</b> and <b>GuardDuty Runtime Monitoring</b> for task-level metrics and threat detection.`,
    `<b>Scheduled and event-driven tasks</b> started by EventBridge.`
  ],
  when: [
    `Stateless HTTP APIs and web applications behind an Application Load Balancer.`,
    `Background workers that read from SQS, and scheduled batch jobs.`,
    `Teams that want containers without running Kubernetes or patching hosts.`,
    `Workloads with variable load, where paying per task-second beats paying for idle instances.`
  ],
  whenNot: [
    `<b>You need Kubernetes</b> (existing manifests, Helm charts, operators, portability across clouds): use Amazon EKS.`,
    `<b>You need GPUs, privileged containers, daemon tasks or a specific instance family:</b> use ECS on EC2.`,
    `<b>Large, steady fleets where compute cost dominates:</b> well-packed EC2 instances with Savings Plans or Spot usually cost less per vCPU than Fargate.`,
    `<b>Short, event-driven work that can finish within 15 minutes and scales to zero:</b> AWS Lambda is simpler.`,
    `<b>A single simple web service with no need for VPC-level control:</b> AWS App Runner needs less setup.`
  ],
  interactions: [
    `<b>Amazon ECR:</b> stores the images; scan-on-push and lifecycle policies keep the repository clean.`,
    `<b>Elastic Load Balancing:</b> an ALB (HTTP) or NLB (TCP) in front of the service; ECS registers and deregisters task IPs.`,
    `<b>IAM:</b> task execution role and task role.`,
    `<b>Secrets Manager and Parameter Store:</b> secrets injected as environment variables at start.`,
    `<b>CloudWatch:</b> logs through the <code>awslogs</code> driver (or FireLens for other destinations), metrics, alarms, Container Insights.`,
    `<b>Application Auto Scaling:</b> scales the service's desired count.`,
    `<b>CodeDeploy and CodePipeline:</b> blue/green deployments and release pipelines.`,
    `<b>EventBridge:</b> runs scheduled tasks and receives task state-change events.`,
    `<b>VPC:</b> subnets, security groups and endpoints decide what a task can reach.`
  ],
  example: {
    title: 'Task definition and service for a Spring Boot API (Terraform)', lang: 'hcl',
    code: `resource "aws_ecs_task_definition" "api" {
  family                   = "payments-api"
  requires_compatibilities = ["FARGATE"]
  network_mode             = "awsvpc"
  cpu                      = 512
  memory                   = 1024
  execution_role_arn       = aws_iam_role.task_execution.arn # pull image, logs, secrets
  task_role_arn            = aws_iam_role.task.arn           # what the app may call

  runtime_platform {
    cpu_architecture        = "ARM64"
    operating_system_family = "LINUX"
  }

  container_definitions = jsonencode([{
    name         = "api"
    image        = "\${aws_ecr_repository.api.repository_url}@\${var.image_digest}"
    essential    = true
    portMappings = [{ containerPort = 8080, protocol = "tcp" }]
    secrets = [{
      name      = "SPRING_DATASOURCE_PASSWORD"
      valueFrom = aws_secretsmanager_secret.db.arn
    }]
    logConfiguration = {
      logDriver = "awslogs"
      options = {
        "awslogs-group"         = aws_cloudwatch_log_group.api.name
        "awslogs-region"        = var.region
        "awslogs-stream-prefix" = "api"
      }
    }
  }])
}

resource "aws_ecs_service" "api" {
  name            = "payments-api"
  cluster         = aws_ecs_cluster.main.id
  task_definition = aws_ecs_task_definition.api.arn
  desired_count   = 3
  launch_type     = "FARGATE"

  network_configuration {
    subnets          = aws_subnet.private[*].id
    security_groups  = [aws_security_group.api.id]
    assign_public_ip = false
  }

  load_balancer {
    target_group_arn = aws_lb_target_group.api.arn # target_type must be "ip"
    container_name   = "api"
    container_port   = 8080
  }

  deployment_circuit_breaker {
    enable   = true
    rollback = true
  }

  health_check_grace_period_seconds = 60
}`,
    notes: `<p>The image is referenced by digest, not by a tag such as <code>latest</code>, so a deployment always runs exactly the image that was tested. In CloudFormation these are <code>AWS::ECS::TaskDefinition</code> and <code>AWS::ECS::Service</code>; in CDK the <code>ApplicationLoadBalancedFargateService</code> pattern creates the service, load balancer and roles together.</p>`
  },
  useCases: [
    `<b>Payments API:</b> three tasks across three AZs behind an ALB, scaling on request count, database password injected from Secrets Manager.`,
    `<b>Queue workers:</b> a service that scales on SQS queue depth and runs on Fargate Spot because jobs can be retried.`,
    `<b>Nightly reconciliation job:</b> an EventBridge schedule runs one task, which exits when finished.`,
    `<b>Migration target:</b> a Docker Compose application moved to AWS with little change.`
  ],
  pricing: `<p>ECS itself has no charge on Fargate. Fargate bills for the vCPU and memory a task requests, per second with a one-minute minimum, from image pull until the task stops. Ephemeral storage above the included 20 GiB is extra.</p>
<ul><li><b>Fargate Spot</b> is substantially cheaper in exchange for possible interruption.</li>
<li><b>Compute Savings Plans</b> apply to Fargate.</li>
<li><b>ARM64 (Graviton)</b> tasks have a lower rate than x86.</li>
<li>Around it you also pay for the load balancer, NAT gateway or interface endpoints, CloudWatch Logs ingestion and data transfer.</li></ul>
<p>Main cost drivers: over-sized task definitions, tasks left running in non-production environments, and verbose logs.</p>`,
  pricingLink: 'https://aws.amazon.com/fargate/pricing/',
  alternatives: [
    `<b>ECS on EC2:</b> same orchestrator, you manage the instances. More control and often cheaper at steady scale. ECS Managed Instances, announced in 2025, has AWS manage those instances for you [[verify]].`,
    `<b>Amazon EKS:</b> managed Kubernetes. Choose it for the Kubernetes ecosystem, not for simplicity.`,
    `<b>AWS Lambda:</b> no containers to keep running; limited to 15 minutes per invocation.`,
    `<b>AWS App Runner:</b> source or image to HTTPS endpoint with almost no configuration.`,
    `<b>Elastic Beanstalk:</b> older platform-as-a-service that manages EC2 for you.`
  ],
  mistakes: [
    `<b>Mixing up the two roles.</b> "Access denied" while pulling the image or reading a secret is the execution role. "Access denied" inside your code is the task role.`,
    `<b>No route to ECR.</b> A task in a private subnet with no NAT gateway and no endpoints fails with <code>CannotPullContainerError</code>.`,
    `<b>Tasks in public subnets with public IPs</b> to avoid NAT. It works, and it puts your application directly on the internet.`,
    `<b>Deploying the <code>latest</code> tag.</b> You cannot tell which code is running or roll back reliably. Use immutable tags or digests.`,
    `<b>Secrets as plain environment variables</b> in the task definition, visible to anyone who can describe it.`,
    `<b>No circuit breaker.</b> A broken image makes ECS start and stop tasks indefinitely.`,
    `<b>Health check grace period too short</b> for a slow-starting JVM, so the load balancer kills tasks before they are ready.`,
    `<b>Ignoring <code>SIGTERM</code>.</b> In-flight requests are dropped on every deployment unless the application shuts down gracefully.`,
    `<b>Target group type <code>instance</code></b> instead of <code>ip</code>.`,
    `<b>No log retention set</b>, so CloudWatch Logs keeps everything forever.`
  ],
  exam: {
    saa: ['2.1', '3.2', '4.2'], sap: ['1.1', '4.2', '5.2', '5.3'],
    trap: `<ul><li>"Run containers with the least operational overhead": Fargate. "Must use Kubernetes": EKS. "Needs GPUs or host access": the EC2 launch type.</li>
<li>Permissions for application code go on the task role, not the execution role and not the instance profile.</li>
<li>Fargate Spot suits fault-tolerant workers, not a service that must never drop below its desired count.</li></ul>`,
    proAdds: `<p>The Professional exam adds deployment strategy (blue/green and canary with automatic rollback), cross-account pipelines that promote one image through environments, image scanning and signing, service-to-service communication with Service Connect or VPC Lattice, capacity provider strategies for cost, Container Insights, and multi-cluster or multi-Region designs for disaster recovery.</p>`
  },
  docs: [
    { label: 'Amazon ECS Developer Guide', url: 'https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html' },
    { label: 'AWS Fargate for Amazon ECS', url: 'https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html' }
  ],
  diagram: DG_ECS
}
];

SERVICES.push(
{
  id: 'kms', name: 'AWS Key Management Service (KMS)', category: 'security', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['AWS KMS'],
  summary: 'Creates and controls the encryption keys that protect data in almost every other AWS service.',
  what: `<p>AWS KMS is a managed service for creating, storing and controlling cryptographic keys. Most AWS services that store data (S3, EBS, RDS, DynamoDB, Secrets Manager and many more) call KMS to encrypt it. Key material is generated and used inside hardware security modules and never leaves them in plain text.</p>`,
  problem: `<p>Encryption is easy; managing keys is hard. KMS answers the hard questions in one place: who may use a key, when it rotates, how its use is audited, and what happens when someone leaves or a workload is retired.</p>`,
  how: `<ul>
<li><b>Three kinds of key ownership.</b> <i>AWS owned keys</i> are invisible and free. <i>AWS managed keys</i> (aliases like <code>aws/s3</code>) live in your account but AWS sets their policy. <i>Customer managed keys</i> are yours: you write the key policy, control rotation and can share them across accounts.</li>
<li><b>Envelope encryption.</b> KMS encrypts at most 4 KB directly. For real data, a service asks KMS for a <i>data key</i>, encrypts the data locally with it, then stores the data key encrypted under the KMS key alongside the data. Decryption reverses this.</li>
<li><b>The key policy is the root of access.</b> Every key has one. An IAM policy can grant use of a key only if the key policy allows the account to delegate. This is why "the role has permission but decrypt fails" is so common.</li>
<li><b>Grants</b> give temporary, narrow use of a key to a principal, typically an AWS service acting for you.</li>
<li><b>Rotation.</b> Customer managed symmetric keys can rotate automatically (yearly by default, with a configurable period). Old key material is kept so existing data still decrypts. AWS managed keys rotate yearly.</li>
<li><b>Regional.</b> A key exists in one Region. <i>Multi-Region keys</i> are related keys with the same key material in several Regions, so data encrypted in one Region can be decrypted in another.</li>
<li><b>Deletion is scheduled</b>, with a waiting period of 7 to 30 days. Once a key is gone, everything encrypted under it is unrecoverable.</li>
<li><b>Request quotas.</b> Cryptographic operations are throttled per account and Region. High-volume S3 workloads use S3 Bucket Keys to cut KMS calls.</li>
</ul>`,
  features: [
    `<b>Multi-Region keys</b> for disaster recovery and global tables.`,
    `<b>Automatic and on-demand rotation.</b>`,
    `<b>Encryption context</b>: extra key-value data that must match on decrypt and appears in CloudTrail.`,
    `<b>Custom key stores</b>: keys backed by your own CloudHSM cluster, or by a key manager outside AWS (external key store).`,
    `<b>Imported key material</b> (bring your own key), with optional expiry.`,
    `<b>Asymmetric and HMAC keys</b> for signing and verification.`,
    `<b>Post-quantum options</b>: ML-DSA signing keys and hybrid post-quantum TLS (ML-KEM) on KMS endpoints [[verify]].`
  ],
  when: [
    `Encrypting data at rest in AWS services where you need control over who can decrypt and an audit trail of every use.`,
    `Application-level envelope encryption of sensitive fields (card data, identity documents).`,
    `Digital signing with keys that never leave AWS.`,
    `Sharing encrypted snapshots or buckets with another account.`
  ],
  whenNot: [
    `<b>Storing passwords or API keys:</b> that is Secrets Manager (which uses KMS underneath).`,
    `<b>A single-tenant HSM you operate</b>, or a compliance rule that demands one: AWS CloudHSM.`,
    `<b>TLS certificates for load balancers and CloudFront:</b> AWS Certificate Manager.`,
    `<b>Encrypting large payloads directly:</b> use a data key (envelope encryption), not the Encrypt API.`
  ],
  interactions: [
    `<b>S3, EBS, RDS, Aurora, DynamoDB, EFS, Redshift, SQS, SNS, Secrets Manager, CloudWatch Logs:</b> server-side encryption with a KMS key.`,
    `<b>IAM:</b> key policy and IAM policy are evaluated together.`,
    `<b>CloudTrail:</b> logs every use of every key.`,
    `<b>CloudHSM:</b> backs a custom key store.`,
    `<b>Organizations:</b> resource control policies can restrict who may use keys across all accounts.`
  ],
  example: { title: 'A customer managed key with rotation and a readable alias (Terraform)', lang: 'hcl',
    code: `resource "aws_kms_key" "data" {
  description             = "Payments data at rest"
  enable_key_rotation     = true
  deletion_window_in_days = 30
}

resource "aws_kms_alias" "data" {
  name          = "alias/payments-data"
  target_key_id = aws_kms_key.data.key_id
}`,
    notes: `<p>With no <code>policy</code> argument, Terraform applies the default key policy, which lets IAM policies in the same account grant access. For cross-account use, add the other account as a principal in the key policy and grant <code>kms:Decrypt</code> in that account's IAM policy as well.</p>` },
  useCases: [
    `<b>Cardholder data:</b> a dedicated key per environment, usable only by the payments task role, every decrypt logged.`,
    `<b>Cross-account backups:</b> snapshots encrypted with a customer managed key that the backup account is allowed to use.`,
    `<b>Multi-Region DR:</b> a multi-Region key so replicated data can be read after failover.`
  ],
  pricing: `<p>A monthly charge for each customer managed key, plus a charge per API request above a free allowance. AWS managed keys have no monthly charge but their requests are billed. AWS owned keys cost nothing. Main cost driver at scale is request volume, which S3 Bucket Keys and data key caching reduce.</p>`,
  pricingLink: 'https://aws.amazon.com/kms/pricing/',
  alternatives: [
    `<b>AWS CloudHSM:</b> dedicated HSMs you control; more work, needed for some compliance regimes.`,
    `<b>Service default encryption</b> (for example SSE-S3): no key management at all, and no per-key access control or audit.`,
    `<b>External key store:</b> keys held outside AWS for sovereignty requirements, at the cost of availability depending on your key manager.`
  ],
  mistakes: [
    `<b>Granting IAM permissions and forgetting the key policy</b>, or the reverse.`,
    `<b>Using an AWS managed key for something you later need to share.</b> AWS managed keys cannot be used cross-account; you must re-encrypt with a customer managed key.`,
    `<b>Deleting a key that still protects data.</b> Disable first and watch CloudTrail before scheduling deletion.`,
    `<b>Assuming keys are global.</b> A copy to another Region must be re-encrypted with a key in that Region (or use multi-Region keys).`,
    `<b>KMS throttling</b> under heavy S3 SSE-KMS traffic without Bucket Keys.`,
    `<b>One key for everything.</b> Separate keys per data classification and environment keep access narrow.`
  ],
  exam: { saa: ['1.3'], sap: ['2.2'],
    trap: `<ul><li>"Customer must control and audit key usage" means SSE-KMS with a customer managed key, not SSE-S3.</li>
<li>Sharing an encrypted snapshot or AMI with another account needs a customer managed key.</li>
<li>"Dedicated, single-tenant hardware" points to CloudHSM.</li>
<li>Access to encrypted data needs both the data permission (for example <code>s3:GetObject</code>) and <code>kms:Decrypt</code>.</li></ul>`,
    proAdds: `<p>Key strategy across an organisation: central vs per-account keys, multi-Region keys for DR, external key stores for sovereignty, RCPs to stop keys being used from outside the organisation, and post-quantum cryptography options.</p>` },
  docs: [{ label: 'AWS KMS Developer Guide', url: 'https://docs.aws.amazon.com/kms/latest/developerguide/overview.html' }]
},
{
  id: 'secrets-manager', name: 'AWS Secrets Manager', category: 'security', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['AWS Secrets Manager'],
  summary: 'Stores database passwords, API keys and other secrets, hands them to applications at run time, and rotates them.',
  what: `<p>Secrets Manager stores secrets encrypted with KMS, controls access with IAM and resource policies, and can rotate them automatically. Applications fetch the current value when they need it, so nothing sensitive sits in code, images or configuration files.</p>`,
  problem: `<p>Hard-coded credentials leak through source control, logs and backups, and nobody dares rotate them because nobody knows where they are used. A central store with rotation removes both problems.</p>`,
  how: `<ul>
<li><b>A secret</b> holds up to 65,536 bytes, usually JSON with fields such as username and password.</li>
<li><b>Versions and staging labels.</b> <code>AWSCURRENT</code> is the live value, <code>AWSPREVIOUS</code> the last one, <code>AWSPENDING</code> a value being rotated in.</li>
<li><b>Rotation.</b> Managed rotation is built in for Amazon RDS, Aurora, Redshift and DocumentDB credentials. Anything else rotates through a Lambda function you provide. RDS can also create and manage the master password in Secrets Manager for you.</li>
<li><b>Access.</b> IAM policies on the caller, plus an optional resource policy on the secret for cross-account access. The caller also needs <code>kms:Decrypt</code> if the secret uses a customer managed key.</li>
<li><b>Replication.</b> A secret can be replicated to other Regions and kept in sync for multi-Region applications.</li>
<li><b>Delivery.</b> ECS and EKS inject secrets at start; Lambda can use the Parameters and Secrets extension to cache them; SDK caching libraries cut cost and latency elsewhere.</li>
</ul>`,
  features: [`<b>Automatic rotation</b> on a schedule, with managed rotation for AWS databases.`, `<b>Multi-Region replication.</b>`, `<b>Resource policies</b> for cross-account sharing.`, `<b>RDS-managed master passwords.</b>`, `<b>CloudTrail logging</b> of every retrieval.`],
  when: [`Database credentials, especially when rotation is required.`, `Third-party API keys and OAuth client secrets.`, `Any secret that more than one service or account must read.`],
  whenNot: [
    `<b>Plain configuration values</b> (feature flags, URLs): Systems Manager Parameter Store is free for standard parameters.`,
    `<b>Secrets that never rotate and are read constantly, at very large counts:</b> Parameter Store SecureString may be cheaper.`,
    `<b>Encryption keys:</b> those belong in KMS.`,
    `<b>Credentials for AWS itself:</b> use IAM roles, not stored access keys.`
  ],
  interactions: [`<b>KMS:</b> encrypts every secret.`, `<b>RDS, Aurora, Redshift, DocumentDB:</b> managed rotation.`, `<b>Lambda:</b> custom rotation functions.`, `<b>ECS, EKS, Lambda:</b> injection and caching.`, `<b>VPC interface endpoint:</b> lets private subnets reach Secrets Manager without a NAT gateway.`],
  example: { title: 'Let RDS create and rotate the master password in Secrets Manager (Terraform)', lang: 'hcl',
    code: `resource "aws_db_instance" "main" {
  identifier                  = "payments"
  engine                      = "postgres"
  instance_class              = "db.t4g.medium"
  allocated_storage           = 50
  username                    = "app_admin"
  manage_master_user_password = true   # password never appears in code or state
  multi_az                    = true
  storage_encrypted           = true
  db_subnet_group_name        = aws_db_subnet_group.isolated.name
}`,
    notes: `<p>The secret's ARN is exposed as <code>aws_db_instance.main.master_user_secret[0].secret_arn</code>, ready to reference in an ECS task definition's <code>secrets</code> block.</p>` },
  useCases: [`<b>Payments API:</b> database password injected into the Fargate task at start and rotated every 30 days.`, `<b>Partner integration:</b> an acquirer's API key stored once and read by two services.`, `<b>Multi-Region service:</b> the same secret replicated to the DR Region.`],
  pricing: `<p>A monthly charge per secret (replicas count as secrets) plus a charge per 10,000 API calls. Rotation Lambda functions are billed as Lambda. Caching in the application is the main way to control the API charge.</p>`,
  pricingLink: 'https://aws.amazon.com/secrets-manager/pricing/',
  alternatives: [`<b>Systems Manager Parameter Store:</b> free standard tier, SecureString with KMS, no built-in rotation, smaller values (4 KB standard, 8 KB advanced).`, `<b>IAM database authentication</b> for RDS: short-lived tokens with no password at all.`, `<b>Third-party vaults</b> (self-managed) when you need features across multiple clouds.`],
  mistakes: [
    `<b>Calling GetSecretValue on every request</b> with no caching.`,
    `<b>Rotating a password the application has cached forever</b>, so connections fail after rotation. Use the alternating-users strategy or reconnect logic.`,
    `<b>Rotation Lambda with no network path</b> to the database or to the Secrets Manager endpoint.`,
    `<b>Secret values in Terraform variables or state.</b> Let the service generate the value.`,
    `<b>Broad <code>secretsmanager:GetSecretValue</code> on <code>*</code>.</b> Scope to the secret's ARN.`
  ],
  exam: { saa: ['1.3'], sap: ['2.2'],
    trap: `<ul><li>"Automatically rotate database credentials" is Secrets Manager. Parameter Store does not rotate by itself.</li><li>"Lowest cost for configuration and a few encrypted values" is Parameter Store.</li></ul>`,
    proAdds: `<p>Cross-account secret sharing with resource policies and KMS key policies, multi-Region replication for DR, and rotation strategy for zero-downtime (alternating users).</p>` },
  docs: [{ label: 'AWS Secrets Manager User Guide', url: 'https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html' }]
},
{
  id: 'acm', name: 'AWS Certificate Manager (ACM)', category: 'security', tier: 1, mgmt: 'aws', status: 'current',
  scopeNames: ['AWS Certificate Manager (ACM)'],
  summary: 'Issues and renews the TLS certificates used by load balancers, CloudFront and API Gateway.',
  what: `<p>ACM provisions public TLS certificates, attaches them to AWS services that terminate HTTPS, and renews them automatically. Public certificates used this way are free.</p>`,
  problem: `<p>Expired certificates cause outages, and private keys copied onto servers get lost or stolen. ACM keeps the private key inside AWS and renews without anyone remembering to.</p>`,
  how: `<ul>
<li><b>Validation.</b> You prove you control the domain by DNS (a CNAME record, preferred) or email. With DNS validation in place and the certificate in use, renewal is automatic.</li>
<li><b>Regional.</b> A certificate is usable only in the Region where it was issued. <b>CloudFront requires the certificate to be in <code>us-east-1</code>.</b></li>
<li><b>Integrated services</b> include Application and Network Load Balancers, CloudFront, API Gateway and others. The private key of a standard public certificate cannot be exported, so it cannot be installed directly on an EC2 instance. Exportable public certificates are a newer paid option [[verify]].</li>
<li><b>Imported certificates</b> from another authority work, but ACM does not renew them.</li>
<li><b>AWS Private CA</b> is a separate, paid service for certificates inside your organisation (service-to-service TLS, devices).</li>
</ul>`,
  features: [`<b>Managed renewal.</b>`, `<b>Wildcard and multi-name certificates.</b>`, `<b>Expiry events</b> in EventBridge for imported certificates.`, `<b>Private CA integration.</b>`],
  when: [`HTTPS on an ALB, NLB (TLS listener), CloudFront distribution or API Gateway custom domain.`, `Any public endpoint where you want zero certificate maintenance.`],
  whenNot: [`<b>TLS terminated on your own EC2 instances or containers:</b> you need an exportable certificate, a Private CA certificate, or a third-party certificate.`, `<b>Internal service names:</b> use AWS Private CA.`, `<b>Code signing or client certificates</b> for general use: not ACM public certificates.`],
  interactions: [`<b>Route 53:</b> one-click DNS validation records.`, `<b>Elastic Load Balancing, CloudFront, API Gateway:</b> where certificates are attached.`, `<b>EventBridge:</b> expiry notifications.`],
  example: { title: 'DNS-validated certificate (Terraform)', lang: 'hcl',
    code: `resource "aws_acm_certificate" "api" {
  domain_name       = "api.example.co.nz"
  validation_method = "DNS"
  lifecycle { create_before_destroy = true }
}

resource "aws_route53_record" "validation" {
  for_each = { for o in aws_acm_certificate.api.domain_validation_options : o.domain_name => o }
  zone_id  = aws_route53_zone.main.zone_id
  name     = each.value.resource_record_name
  type     = each.value.resource_record_type
  records  = [each.value.resource_record_value]
  ttl      = 300
}`,
    notes: `<p>Leave the validation record in place permanently: ACM uses it again at every renewal.</p>` },
  useCases: [`<b>Public API:</b> certificate on the ALB, renewed without intervention.`, `<b>Global site:</b> certificate in us-east-1 for CloudFront, a second one in the origin's Region for the load balancer.`],
  pricing: `<p>Public certificates used with integrated AWS services are free. You pay for AWS Private CA (monthly per CA plus per certificate) and for exportable public certificates.</p>`,
  pricingLink: 'https://aws.amazon.com/certificate-manager/pricing/',
  alternatives: [`<b>Third-party certificate imported into ACM:</b> when a specific authority or extended validation is required; you handle renewal.`, `<b>Let's Encrypt on the host:</b> when TLS must terminate on the instance.`],
